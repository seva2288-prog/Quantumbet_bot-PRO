<!DOCTYPE html>
<html lang="ru" data-theme="dark">
<head>
    <title>Quantum Bet Bot</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
    <style>
        /* ============================================================
           БАЗОВЫЕ СТИЛИ
           ============================================================ */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Arial, sans-serif;
            background: #08080f;
            color: #e8e8f0;
            min-height: 100vh;
            overflow-x: hidden;
            padding-bottom: 90px;
            transition: background 0.3s, color 0.3s;
        }

        body.light-theme {
            background: #ececf5;
            color: #16162a;
        }

        /* ============================================================
           ЭКРАН ЗАГРУЗКИ
           ============================================================ */
        #loadingScreen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #08080f;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 99999;
            transition: opacity 0.6s;
        }

        #loadingScreen .logo {
            font-size: 52px;
            font-weight: 700;
            background: linear-gradient(135deg, #a78bfa, #7c3aed);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            animation: pulse 2s infinite;
        }

        #loadingScreen .spinner {
            width: 32px;
            height: 32px;
            margin-top: 28px;
            border: 2px solid rgba(167, 139, 250, 0.08);
            border-top-color: #a78bfa;
            border-radius: 50%;
            animation: spin 0.7s linear infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.6; transform: scale(0.97); }
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        /* ============================================================
           ЗВЁЗДЫ
           ============================================================ */
        .stars-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            pointer-events: none;
            overflow: hidden;
            background: radial-gradient(ellipse at 30% 50%, #0c0c22, #05050d);
        }

        .star {
            position: absolute;
            border-radius: 50%;
            background: white;
            animation: twinkle var(--duration) ease-in-out infinite alternate;
        }

        @keyframes twinkle {
            0% { opacity: 0.15; transform: scale(0.7); }
            100% { opacity: 1; transform: scale(1.2); }
        }

        /* ============================================================
           ОСНОВНОЙ КОНТЕЙНЕР
           ============================================================ */
        .container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 12px;
            padding-bottom: 90px;
            position: relative;
            z-index: 1;
        }

        /* ============================================================
           ШАПКА
           ============================================================ */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 8px;
            margin-bottom: 14px;
            padding: 12px 16px;
            background: rgba(20, 20, 40, 0.65);
            backdrop-filter: blur(18px);
            border-radius: 14px;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        .header h1 {
            font-size: 18px;
            font-weight: 700;
            background: linear-gradient(135deg, #a78bfa, #7c3aed);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .header-controls {
            display: flex;
            align-items: center;
            gap: 6px;
            flex-wrap: wrap;
        }

        .status {
            display: flex;
            align-items: center;
            gap: 5px;
            color: #34d399;
            font-size: 10px;
            font-weight: 500;
        }

        .status-dot {
            width: 7px;
            height: 7px;
            background: #34d399;
            border-radius: 50%;
            animation: pulse-dot 1.8s infinite;
        }

        @keyframes pulse-dot {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.4; }
        }

        .theme-toggle {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.06);
            border-radius: 50%;
            width: 30px;
            height: 30px;
            font-size: 14px;
            cursor: pointer;
            color: #e8e8f0;
            transition: 0.3s;
        }

        .theme-toggle:hover {
            transform: scale(1.08);
            border-color: #7c3aed;
        }

        .refresh-btn {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.06);
            border-radius: 50%;
            width: 30px;
            height: 30px;
            font-size: 14px;
            cursor: pointer;
            color: #e8e8f0;
            transition: 0.3s;
        }

        .refresh-btn:hover {
            transform: scale(1.08);
            border-color: #7c3aed;
        }

        /* ============================================================
           КАРТОЧКИ
           ============================================================ */
        .card {
            background: rgba(20, 20, 40, 0.55);
            backdrop-filter: blur(14px);
            border: 1px solid rgba(255, 255, 255, 0.04);
            border-radius: 14px;
            padding: 16px;
            margin-bottom: 12px;
            transition: 0.3s;
        }

        .card:hover {
            border-color: rgba(167, 139, 250, 0.1);
        }

        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
            flex-wrap: wrap;
            gap: 6px;
        }

        .card-header h2 {
            color: rgba(255, 255, 255, 0.5);
            font-size: 14px;
            font-weight: 600;
        }

        .card-header h2.primary {
            color: #a78bfa;
        }

        /* ============================================================
           СТАТИСТИКА
           ============================================================ */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
            gap: 10px;
            margin-bottom: 14px;
        }

        .stat-card {
            padding: 14px 10px;
            border-radius: 12px;
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid rgba(255, 255, 255, 0.04);
            text-align: center;
            transition: 0.3s;
        }

        .stat-card:hover {
            border-color: rgba(167, 139, 250, 0.15);
            transform: translateY(-2px);
        }

        .stat-card .value {
            font-size: 22px;
            font-weight: 700;
            background: linear-gradient(135deg, #c4b5fd, #a78bfa);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .stat-card .value.green {
            background: linear-gradient(135deg, #34d399, #6ee7b7);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .stat-card .value.red {
            background: linear-gradient(135deg, #f87171, #fca5a5);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .stat-card .value.gold {
            background: linear-gradient(135deg, #fbbf24, #fcd34d);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .stat-card .label {
            color: rgba(255, 255, 255, 0.4);
            font-size: 10px;
            margin-top: 6px;
            font-weight: 500;
        }

        /* ============================================================
           МЕТРИКИ
           ============================================================ */
        .metrics-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-bottom: 14px;
        }

        .metric {
            background: rgba(255, 255, 255, 0.02);
            padding: 10px 14px;
            border-radius: 10px;
            border: 1px solid rgba(255, 255, 255, 0.04);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .metric .label {
            color: rgba(255, 255, 255, 0.45);
            font-size: 12px;
            font-weight: 500;
        }

        .metric .value {
            font-size: 18px;
            font-weight: 700;
            color: #e8e8f0;
        }

        .metric .value.green { color: #34d399; }
        .metric .value.gold { color: #fbbf24; }

        /* ============================================================
           ТАБЛИЦА
           ============================================================ */
        .table-wrapper {
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 11px;
            min-width: 650px;
        }

        th, td {
            padding: 6px 8px;
            text-align: left;
            border-bottom: 1px solid rgba(255, 255, 255, 0.03);
        }

        th {
            color: rgba(255, 255, 255, 0.35);
            font-weight: 600;
            font-size: 9px;
            text-transform: uppercase;
            background: rgba(255, 255, 255, 0.01);
        }

        tr:hover td {
            background: rgba(255, 255, 255, 0.015);
        }

        .badge {
            display: inline-block;
            padding: 1px 8px;
            border-radius: 10px;
            font-size: 8px;
            font-weight: 600;
            text-transform: uppercase;
        }

        .badge.win {
            background: rgba(52, 211, 153, 0.12);
            color: #34d399;
            border: 1px solid rgba(52, 211, 153, 0.08);
        }

        .badge.loss {
            background: rgba(248, 113, 113, 0.12);
            color: #f87171;
            border: 1px solid rgba(248, 113, 113, 0.08);
        }

        .badge.push {
            background: rgba(251, 191, 36, 0.12);
            color: #fbbf24;
            border: 1px solid rgba(251, 191, 36, 0.08);
        }

        .badge.pending {
            background: rgba(255, 255, 255, 0.03);
            color: rgba(255, 255, 255, 0.35);
            border: 1px solid rgba(255, 255, 255, 0.04);
        }

        .profit-positive { color: #34d399; font-weight: 600; }
        .profit-negative { color: #f87171; font-weight: 600; }

        .edit-btn {
            cursor: pointer;
            color: rgba(255, 255, 255, 0.25);
            transition: 0.25s;
        }

        .edit-btn:hover {
            color: #a78bfa;
        }

        .edit-row {
            display: none;
        }

        .edit-row.active {
            display: table-row;
        }

        .edit-row td {
            background: rgba(167, 139, 250, 0.05);
        }

        .edit-row input,
        .edit-row select {
            padding: 3px 6px;
            border-radius: 4px;
            border: 1px solid rgba(255, 255, 255, 0.05);
            background: rgba(0, 0, 0, 0.3);
            color: #e8e8f0;
            font-size: 10px;
            height: 24px;
        }

        /* ============================================================
           НАВИГАЦИЯ
           ============================================================ */
        .bottom-nav {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            width: 92%;
            max-width: 480px;
            background: rgba(255, 255, 255, 0.06);
            backdrop-filter: blur(28px);
            border-radius: 28px;
            border: 1px solid rgba(255, 255, 255, 0.08);
            display: flex;
            justify-content: space-around;
            align-items: center;
            padding: 10px 8px;
            z-index: 1000;
        }

        .bottom-nav .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: rgba(255, 255, 255, 0.35);
            font-size: 10px;
            padding: 8px 16px;
            border-radius: 18px;
            border: none;
            background: transparent;
            cursor: pointer;
            min-width: 58px;
            gap: 3px;
            transition: 0.25s;
            position: relative;
        }

        .bottom-nav .nav-item .icon {
            font-size: 24px;
            line-height: 1.1;
        }

        .bottom-nav .nav-item .label {
            font-size: 9px;
            font-weight: 600;
            opacity: 0.5;
        }

        .bottom-nav .nav-item.active {
            color: #a78bfa;
            background: rgba(167, 139, 250, 0.1);
        }

        .bottom-nav .nav-item.active .label {
            opacity: 1;
            color: #a78bfa;
        }

        .bottom-nav .nav-item.active::before {
            content: '';
            position: absolute;
            top: -1px;
            left: 50%;
            transform: translateX(-50%);
            width: 20px;
            height: 3px;
            background: linear-gradient(90deg, #7c3aed, #a78bfa);
            border-radius: 3px;
        }

        .bottom-nav .nav-item:active {
            transform: scale(0.9);
        }

        /* ============================================================
           СВЕТЛАЯ ТЕМА
           ============================================================ */
        body.light-theme .card {
            background: rgba(255, 255, 255, 0.75);
            border: 1px solid rgba(0, 0, 0, 0.05);
        }

        body.light-theme .header {
            background: rgba(255, 255, 255, 0.75);
            border: 1px solid rgba(0, 0, 0, 0.05);
        }

        body.light-theme .bottom-nav {
            background: rgba(255, 255, 255, 0.75);
            border: 1px solid rgba(0, 0, 0, 0.05);
        }

        body.light-theme .bottom-nav .nav-item {
            color: rgba(0, 0, 0, 0.35);
        }

        body.light-theme .bottom-nav .nav-item.active {
            color: #7c3aed;
            background: rgba(124, 58, 237, 0.06);
        }

        body.light-theme .bottom-nav .nav-item.active .label {
            color: #7c3aed;
        }

        body.light-theme .stat-card {
            background: rgba(0, 0, 0, 0.02);
            border-color: rgba(0, 0, 0, 0.04);
        }

        body.light-theme .metric {
            background: rgba(0, 0, 0, 0.02);
            border-color: rgba(0, 0, 0, 0.04);
        }

        body.light-theme .metric .label {
            color: rgba(0, 0, 0, 0.4);
        }

        body.light-theme .metric .value {
            color: #16162a;
        }

        body.light-theme .card-header h2 {
            color: rgba(0, 0, 0, 0.4);
        }

        /* ============================================================
           МОДАЛЬНОЕ ОКНО
           ============================================================ */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.65);
            backdrop-filter: blur(8px);
            z-index: 9999;
            display: none;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .modal-overlay.active {
            display: flex;
        }

        .modal {
            background: rgba(20, 20, 40, 0.95);
            border-radius: 16px;
            border: 1px solid rgba(167, 139, 250, 0.12);
            padding: 24px;
            max-width: 440px;
            width: 100%;
            max-height: 90vh;
            overflow-y: auto;
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 16px;
        }

        .modal-header h3 {
            color: #a78bfa;
            font-size: 18px;
        }

        .modal-close {
            background: rgba(255, 255, 255, 0.04);
            border: none;
            border-radius: 50%;
            width: 30px;
            height: 30px;
            font-size: 16px;
            color: rgba(255, 255, 255, 0.4);
            cursor: pointer;
        }

        .modal-field {
            margin-bottom: 12px;
        }

        .modal-field label {
            font-size: 11px;
            color: rgba(255, 255, 255, 0.3);
            display: block;
            margin-bottom: 4px;
        }

        .modal-field input,
        .modal-field select {
            width: 100%;
            padding: 8px 12px;
            background: rgba(0, 0, 0, 0.35);
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-radius: 6px;
            color: #e8e8f0;
            font-size: 13px;
        }

        .modal-field .row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
        }

        .modal-actions {
            display: flex;
            gap: 8px;
            margin-top: 16px;
        }

        /* ============================================================
           КНОПКИ
           ============================================================ */
        .btn {
            padding: 5px 14px;
            border-radius: 6px;
            border: 1px solid rgba(255, 255, 255, 0.08);
            background: rgba(255, 255, 255, 0.04);
            color: #e8e8f0;
            cursor: pointer;
            font-size: 11px;
            transition: 0.25s;
        }

        .btn:hover {
            background: rgba(255, 255, 255, 0.08);
        }

        .btn-primary {
            background: linear-gradient(135deg, #7c3aed, #6d28d9);
            border: none;
            color: white;
        }

        .btn-primary:hover {
            box-shadow: 0 0 24px rgba(124, 58, 237, 0.25);
        }

        .btn-success {
            background: linear-gradient(135deg, #34d399, #059669);
            border: none;
            color: white;
        }

        .btn-success:hover {
            box-shadow: 0 0 24px rgba(52, 211, 153, 0.25);
        }

        .btn-danger {
            background: linear-gradient(135deg, #f87171, #dc2626);
            border: none;
            color: white;
        }

        .btn-outline {
            background: transparent;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        /* ============================================================
           ГРАФИКИ
           ============================================================ */
        .chart-container {
            height: 150px;
        }

        .chart-container-large {
            height: 340px;
        }

        /* ============================================================
           ПУСТЫЕ СОСТОЯНИЯ
           ============================================================ */
        .no-data {
            text-align: center;
            padding: 30px 0;
            color: rgba(255, 255, 255, 0.25);
        }

        .no-data .emoji {
            font-size: 36px;
            margin-bottom: 8px;
        }

        /* ============================================================
           УВЕДОМЛЕНИЯ
           ============================================================ */
        .notification {
            position: fixed;
            top: 16px;
            right: 16px;
            padding: 10px 18px;
            background: rgba(20, 20, 40, 0.94);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(167, 139, 250, 0.15);
            border-radius: 10px;
            color: #e8e8f0;
            font-size: 13px;
            z-index: 9999;
            animation: slideIn 0.3s ease;
            max-width: 380px;
        }

        .notification.success {
            border-color: rgba(52, 211, 153, 0.25);
        }

        .notification.error {
            border-color: rgba(248, 113, 113, 0.25);
        }

        @keyframes slideIn {
            from { opacity: 0; transform: translateX(80px); }
            to { opacity: 1; transform: translateX(0); }
        }

        @keyframes slideOut {
            from { opacity: 1; transform: translateX(0); }
            to { opacity: 0; transform: translateX(80px); }
        }

        /* ============================================================
           АНАЛИЗ — ЧИТАЕМЫЙ ДИЗАЙН
           ============================================================ */
        .analysis-stats {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 14px;
            margin-bottom: 16px;
        }

        .analysis-stats .item {
            text-align: center;
            padding: 16px;
            background: rgba(255, 255, 255, 0.03);
            border-radius: 12px;
            border: 1px solid rgba(255, 255, 255, 0.05);
            transition: 0.3s;
        }

        .analysis-stats .item:hover {
            border-color: rgba(167, 139, 250, 0.15);
            transform: translateY(-2px);
        }

        .analysis-stats .item .number {
            font-size: 30px;
            font-weight: 700;
        }

        .analysis-stats .item .number.purple { color: #a78bfa; }
        .analysis-stats .item .number.green { color: #34d399; }
        .analysis-stats .item .number.red { color: #f87171; }
        .analysis-stats .item .number.gold { color: #fbbf24; }

        .analysis-stats .item .label {
            font-size: 11px;
            color: rgba(255, 255, 255, 0.4);
            margin-top: 4px;
        }

        .analysis-stats .item .sub {
            font-size: 9px;
            color: rgba(255, 255, 255, 0.15);
            margin-top: 2px;
        }

        .analysis-summary {
            font-size: 13px;
            color: rgba(255, 255, 255, 0.25);
            padding: 10px 16px;
            background: rgba(255, 255, 255, 0.015);
            border-radius: 8px;
            text-align: center;
            margin-bottom: 14px;
        }

        .analysis-summary strong.purple { color: #a78bfa; font-weight: 600; }
        .analysis-summary strong.green { color: #34d399; font-weight: 600; }
        .analysis-summary strong.red { color: #f87171; font-weight: 600; }

        .analysis-reasons {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap: 14px;
            margin-bottom: 16px;
        }

        .analysis-reasons .box {
            padding: 16px;
            border-radius: 12px;
            border-left: 4px solid;
            background: rgba(255, 255, 255, 0.02);
            transition: 0.3s;
        }

        .analysis-reasons .box:hover {
            background: rgba(255, 255, 255, 0.04);
        }

        .analysis-reasons .box .number {
            font-size: 26px;
            font-weight: 700;
        }

        .analysis-reasons .box .label {
            font-size: 11px;
            color: rgba(255, 255, 255, 0.4);
        }

        .analysis-reasons .box .desc {
            font-size: 9px;
            color: rgba(255, 255, 255, 0.15);
            margin-top: 2px;
        }

        .analysis-reasons .box.red { border-left-color: #f87171; }
        .analysis-reasons .box.red .number { color: #f87171; }

        .analysis-reasons .box.gold { border-left-color: #fbbf24; }
        .analysis-reasons .box.gold .number { color: #fbbf24; }

        .analysis-reasons .box.blue { border-left-color: #60a5fa; }
        .analysis-reasons .box.blue .number { color: #60a5fa; }

        .analysis-recommendations {
            display: none;
            padding: 16px;
            background: rgba(167, 139, 250, 0.07);
            border-radius: 12px;
            border: 1px solid rgba(167, 139, 250, 0.12);
            margin-top: 8px;
        }

        .analysis-recommendations.visible {
            display: block;
            animation: fadeIn 0.4s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .analysis-recommendations .title {
            font-size: 14px;
            font-weight: 600;
            color: #a78bfa;
            margin-bottom: 8px;
        }

        .analysis-recommendations .list {
            font-size: 13px;
            color: rgba(255, 255, 255, 0.65);
            line-height: 1.7;
        }

        .analysis-recommendations .list .item {
            padding: 5px 0;
            border-bottom: 1px solid rgba(255, 255, 255, 0.03);
        }

        .analysis-recommendations .list .item:last-child {

        /* ============================================================

        .file-label {

        .file-label:hover {

        /* ============================================================

        .sim-stat .label {
            color: rgba(255, 255, 255, 0.3);

        .slider-container input[type="range"] {

        .slider-container input[type="range"]::-webkit-slider-thumb {

        .chart-controls {

            flex-wrap: wrap;

        .chart-controls select {
            background: rgba(255, 255, 255, 0.04);

        @media (max-width: 768px) {
            .analysis-stats {
                grid-template-columns: 1fr 1fr;

            .analysis-reasons {
                grid-template-columns: 1fr;

            .bottom-nav .nav-item {

            }

            .bottom-nav .nav-item .label {

            }

        @media (max-width: 480px) {

<body>

    <!-- ============================================================
    ЭКРАН ЗАГРУЗКИ
    ============================================================ -->
    <div id="loadingScreen">
        <div class="logo">QUANTUM</div>
        <div class="spinner"></div>
    </div>

    <!-- ============================================================
    ЗВЁЗДЫ
    ============================================================ -->
    <div class="stars-container" id="starsContainer"></div>

    <!-- ============================================================
    ОСНОВНОЙ КОНТЕЙНЕР
    ============================================================ -->
    <div class="container">

        <!-- ШАПКА -->
        <div class="header">
            <h1>🤖 Quantum Bet Bot</h1>
            <div class="header-controls">
                <div class="status">
                    <span class="status-dot"></span>
                    <span>Система активна</span>
                </div>
                <button class="theme-toggle" onclick="toggleTheme()" id="themeBtn">🌙</button>
                <button class="refresh-btn" onclick="refreshData()">🔄</button>
            </div>
        </div>

        <!-- СТРАНИЦЫ -->
        <div id="page-dashboard" class="page active">
            <div id="dashboard-content"></div>
        </div>

        <div id="page-analysis" class="page" style="display:none;">
            <div id="analysis-content"></div>
        </div>

        <div id="page-analytics" class="page" style="display:none;">
            <div id="analytics-content"></div>
        </div>

        <div id="page-simulator" class="page" style="display:none;">
            <div id="simulator-content"></div>
        </div>

        <div id="page-settings" class="page" style="display:none;">
            <div id="settings-content"></div>
        </div>

        <div class="footer">Quantum Bet Bot v12 PRO © 2026</div>
    </div>

    <!-- ============================================================
    НАВИГАЦИЯ
    ============================================================ -->
    <nav class="bottom-nav">
        <button class="nav-item active" data-page="dashboard">
            <span class="icon">📊</span>
            <span class="label">Главная</span>
        </button>
        <button class="nav-item" data-page="analysis">
            <span class="icon">🔍</span>
            <span class="label">Анализ</span>
        </button>
        <button class="nav-item" data-page="analytics">
            <span class="icon">📈</span>
            <span class="label">Аналитика</span>
        </button>
        <button class="nav-item" data-page="simulator">
            <span class="icon">🎲</span>
            <span class="label">Симулятор</span>
        </button>
        <button class="nav-item" data-page="settings">
            <span class="icon">⚙️</span>
            <span class="label">Настройки</span>
        </button>
    </nav>

    <!-- ============================================================
    МОДАЛЬНОЕ ОКНО
    ============================================================ -->
    <div class="modal-overlay" id="addMatchModal">
        <div class="modal">
            <div class="modal-header">
                <h3>➕ Добавить матч</h3>
                <button class="modal-close" onclick="closeModal()">✖</button>
            </div>
            <div class="modal-field">
                <label>🏟️ Название матча</label>
                <input type="text" id="matchName" placeholder="Real Madrid vs Barcelona">
            </div>
            <div class="modal-field">
                <label>⚽ Счёт</label>
                <input type="text" id="matchScore" placeholder="2-1">
            </div>
            <div class="modal-field">
                <label>📊 Ставка</label>
                <input type="text" id="matchBet" placeholder="ТМ 2.5">
            </div>
            <div class="modal-field">
                <div class="row">
                    <div>
                        <label>💰 Коэффициент</label>
                        <input type="number" id="matchOdds" value="1.85" step="0.01">
                    </div>
                    <div>
                        <label>💵 Сумма</label>
                        <input type="number" id="matchStake" value="42.87" step="0.01">
                    </div>
                </div>
            </div>
            <div class="modal-field">
                <label>📊 Результат</label>
                <select id="matchResult">
                    <option value="win">✅ WIN (Выигрыш)</option>
                    <option value="loss">❌ LOSS (Проигрыш)</option>
                    <option value="push">🔄 PUSH (Возврат)</option>
                    <option value="pending">⏳ PENDING (Ожидание)</option>
                </select>
            </div>
            <div class="modal-actions">
                <button class="btn btn-success" onclick="saveMatch()">💾 Сохранить</button>
                <button class="btn btn-outline" onclick="closeModal()">Отмена</button>
            </div>
        </div>
    </div>

    <script>
        // ============================================================
        // КОНФИГУРАЦИЯ
        // ============================================================
        const API_BASE = window.location.origin;
        let cachedData = null;
        let chartMain = null;
        let chartInteractive = null;
        let chartSim = null;
        let chartData = null;
        let currentPage = 'dashboard';
        let isLoading = false;

        // ============================================================
        // ЗВЁЗДЫ
        // ============================================================
        (function generateStars() {
            const container = document.getElementById('starsContainer');
            for (let i = 0; i < 160; i++) {
                const star = document.createElement('div');
                star.className = 'star';
                const size = 0.4 + Math.random() * 2.2;
                star.style.width = size + 'px';
                star.style.height = size + 'px';
                star.style.left = Math.random() * 100 + '%';
                star.style.top = Math.random() * 100 + '%';
                star.style.setProperty('--duration', (2 + Math.random() * 4) + 's');
                star.style.animationDelay = (Math.random() * 5) + 's';
                star.style.opacity = 0.2 + Math.random() * 0.7;
                container.appendChild(star);
            }
        })();

        // ============================================================
        // ЗАГРУЗКА
        // ============================================================
        window.addEventListener('load', function() {
            setTimeout(function() {
                const loader = document.getElementById('loadingScreen');
                loader.style.opacity = '0';
                setTimeout(function() {
                    loader.style.display = 'none';
                }, 600);
            }, 400);
            loadPage('dashboard');
        });

        // ============================================================
        // УВЕДОМЛЕНИЯ
        // ============================================================
        function showNotification(message, type) {
            const notification = document.createElement('div');
            notification.className = 'notification' + (type === 'success' ? ' success' : type === 'error' ? ' error' : '');
            notification.textContent = message;
            document.body.appendChild(notification);

            setTimeout(function() {
                notification.style.animation = 'slideOut 0.3s ease';
                setTimeout(function() {
                    if (notification.parentNode) {
                        notification.remove();
                    }
                }, 300);
            }, 2500);
        }

        // ============================================================
        // ТЕМА
        // ============================================================
        const savedTheme = localStorage.getItem('theme') || 'dark';
        if (savedTheme === 'light') {
            document.body.classList.add('light-theme');
            document.getElementById('themeBtn').textContent = '☀️';
        }

        function toggleTheme() {
            const body = document.body;
            const btn = document.getElementById('themeBtn');
            body.classList.toggle('light-theme');
            const isLight = body.classList.contains('light-theme');
            btn.textContent = isLight ? '☀️' : '🌙';
            localStorage.setItem('theme', isLight ? 'light' : 'dark');

            const color = isLight ? 'rgba(0,0,0,0.6)' : 'rgba(255,255,255,0.6)';
            const gridColor = isLight ? 'rgba(0,0,0,0.05)' : 'rgba(255,255,255,0.03)';

            [chartMain, chartInteractive, chartSim].forEach(function(chart) {
                if (chart) {
                    chart.options.plugins.legend.labels.color = color;
                    chart.options.scales.x.ticks.color = color;
                    chart.options.scales.y.ticks.color = color;
                    chart.options.scales.x.grid.color = gridColor;
                    chart.options.scales.y.grid.color = gridColor;
                    chart.update();
                }
            });
        }

        // ============================================================
        // НАВИГАЦИЯ
        // ============================================================
        document.querySelectorAll('.bottom-nav .nav-item').forEach(function(btn) {
            btn.addEventListener('click', function() {
                const page = this.dataset.page;
                if (page === currentPage) return;

                document.querySelectorAll('.bottom-nav .nav-item').forEach(function(b) {
                    b.classList.remove('active');
                });
                this.classList.add('active');

                document.querySelectorAll('.page').forEach(function(p) {
                    p.style.display = 'none';
                });

                const target = document.getElementById('page-' + page);
                if (target) {
                    target.style.display = 'block';
                }

                currentPage = page;
                loadPage(page);
            });
        });

        // ============================================================
        // ЗАГРУЗКА ДАННЫХ
        // ============================================================
        async function loadPage(page) {
            if (isLoading) return;

            const contentId = page + '-content';
            const contentEl = document.getElementById(contentId);

            if (page !== 'dashboard' && cachedData && contentEl.innerHTML && page !== 'analytics') {
                return;
            }

            isLoading = true;
            contentEl.innerHTML = `
                <div style="text-align:center;padding:40px 0;">
                    <div style="width:28px;height:28px;margin:0 auto 10px;border:2px solid rgba(167,139,250,0.06);border-top-color:#a78bfa;border-radius:50%;animation:spin 0.7s linear infinite;"></div>
                    <div style="color:rgba(255,255,255,0.3);font-size:12px;">Загрузка...</div>
                </div>
            `;

            try {
                const response = await fetch(API_BASE + '/api/all_data?t=' + Date.now());
                if (!response.ok) {
                    throw new Error('Ошибка ' + response.status);
                }
                const data = await response.json();

                try {
                    const matchesRes = await fetch(API_BASE + '/api/matches?t=' + Date.now());
                    if (matchesRes.ok) {
                        data.matches = await matchesRes.json();
                    }
                } catch (e) {}

                cachedData = data;

                switch (page) {
                    case 'dashboard':
                        renderDashboard(data);
                        break;
                    case 'analysis':
                        renderAnalysis(data);
                        break;
                    case 'analytics':
                        renderAnalytics(data);
                        break;
                    case 'simulator':
                        renderSimulator(data);
                        break;
                    case 'settings':
                        renderSettings(data);
                        break;
                }

            } catch (error) {
                contentEl.innerHTML = `
                    <div class="no-data">
                        <div class="emoji">⚠️</div>
                        <div>Ошибка загрузки данных!</div>
                        <div style="font-size:11px;color:rgba(255,255,255,0.3);margin-top:4px;">${error.message}</div>
                        <button onclick="refreshData()" style="margin-top:10px;padding:6px 18px;background:rgba(124,58,237,0.15);border:1px solid rgba(124,58,237,0.2);border-radius:6px;color:#a78bfa;cursor:pointer;">
                            🔄 Повторить
                        </button>
                    </div>
                `;
                showNotification('❌ Ошибка: ' + error.message, 'error');
            }

            isLoading = false;
        }

        function refreshData() {
            cachedData = null;
            loadPage(currentPage);
            showNotification('🔄 Обновление данных...', '');
        }

        // ============================================================
        // ДАШБОРД
        // ============================================================
        function renderDashboard(data) {
            const stats = data.stats || {};
            const history = data.history || [];
            const matches = data.matches || [];

            let allItems = [];

            matches.forEach(function(match) {
                const bestBet = match.best_bet || match.bets?.[0] || {};
                allItems.push({
                    type: 'match',
                    date: match.match_time || 'Сегодня',
                    home: match.home || '?',
                    away: match.away || '?',
                    score: '-',
                    bet: bestBet.label || '—',
                    odds: bestBet.odds || 0,
                    stake: bestBet.stake || 0,
                    ev: bestBet.ev || 0,
                    result: 'pending',
                    profit: 0,
                    marker: bestBet.marker_stake || '',
                    is_active: true
                });
            });

            history.forEach(function(bet) {
                allItems.push({
                    type: 'history',
                    date: bet.date || '-',
                    home: bet.home || '?',
                    away: bet.away || '?',
                    score: (bet.home_goals !== null && bet.away_goals !== null) ?
                        bet.home_goals + ' - ' + bet.away_goals :
                        '-',
                    bet: bet.bet || '—',
                    odds: bet.odds || 0,
                    stake: bet.stake || 0,
                    ev: bet.ev || 0,
                    result: bet.result || 'pending',
                    profit: bet.profit || 0,
                    marker: bet.marker_stake || '',
                    is_active: false
                });
            });

            allItems.sort(function(a, b) {
                if (a.is_active && !b.is_active) return -1;
                if (!a.is_active && b.is_active) return 1;
                try { return new Date(b.date) - new Date(a.date); } catch { return 0; }
            });

            allItems = allItems.slice(0, 50);
            const activeMatches = allItems.filter(function(i) { return i.is_active; }).length;

            let html = `
                <div class="stats-grid">
                    <div class="stat-card"><div class="value">$${stats.bank || 1000}</div><div class="label">💰 Банк</div></div>
                    <div class="stat-card"><div class="value green">${stats.wins || 0}</div><div class="label">✅ Выигрыши</div></div>
                    <div class="stat-card"><div class="value red">${stats.losses || 0}</div><div class="label">❌ Проигрыши</div></div>
                    <div class="stat-card"><div class="value gold">$${stats.profit || 0}</div><div class="label">📈 Прибыль</div></div>
                </div>

                <div class="metrics-grid">
                    <div class="metric"><span class="label">📊 Всего ставок</span><span class="value">${stats.total_bets || 0}</span></div>
                    <div class="metric"><span class="label">🎯 Проходимость</span><span class="value green">${stats.winrate || 0}%</span></div>
                    <div class="metric"><span class="label">📈 ROI</span><span class="value gold">${stats.roi || 0}%</span></div>
                    <div class="metric"><span class="label">📅 Активных матчей</span><span class="value">${activeMatches}</span></div>
                </div>

                <div class="card">
                    <div class="card-header">
                        <h2>📈 График прибыли</h2>
                    </div>
                    <div class="chart-container">
                        <canvas id="profitChart"></canvas>
                    </div>
                </div>

                <div class="card">
                    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;flex-wrap:wrap;gap:6px;">
                        <h2 style="color:rgba(255,255,255,0.45);font-size:13px;font-weight:600;">📋 Все ставки и матчи</h2>
                        <div style="display:flex;gap:6px;flex-wrap:wrap;">
                            <span style="color:rgba(255,255,255,0.2);font-size:10px;">Всего: ${allItems.length} (активных: ${activeMatches})</span>
                            <button class="btn btn-primary" onclick="showModal()" style="padding:3px 12px;font-size:10px;">➕ Добавить матч</button>
                        </div>
                    </div>
                    <div class="table-wrapper">
                        <table>
                            <thead>
                                <tr>
                                    <th>#</th>
                                    <th>Дата</th>
                                    <th>Матч</th>
                                    <th>Счёт</th>
                                    <th>Ставка</th>
                                    <th>Кэф</th>
                                    <th>Сумма</th>
                                    <th>Маркер</th>
                                    <th>EV</th>
                                    <th>Результат</th>
                                    <th>Прибыль</th>
                                    <th></th>
                                </tr>
                            </thead>
                            <tbody>
                    `;

            if (allItems.length === 0) {
                html += `<tr><td colspan="12" class="no-data"><div class="emoji">📭</div>Нет данных</td></tr>`;
            } else {
                allItems.forEach(function(item, idx) {
                    const profitClass = item.profit > 0 ? 'profit-positive' : (item.profit < 0 ? 'profit-negative' :
                        '');
                    const isActive = item.is_active;

                    html += `
                                <tr style="${isActive ? 'background:rgba(167,139,250,0.04);' : ''}">
                                    <td>${idx + 1}</td>
                                    <td style="font-size:9px;white-space:nowrap;">${item.date}</td>
                                    <td><strong>${item.home}</strong> vs <strong>${item.away}</strong></td>
                                    <td>${item.score}</td>
                                    <td>${item.bet}${isActive ? ' 🟢' : ''}</td>
                                    <td>${item.odds}</td>
                                    <td>$${item.stake}</td>
                                    <td style="font-size:9px;font-family:monospace;color:rgba(167,139,250,0.5);">${item.marker || '-'}</td>
                                    <td>${item.ev}%</td>
                                    <td><span class="badge ${item.result}">${item.result}</span></td>
                                    <td class="${profitClass}">${item.profit > 0 ? '+' : ''}$${item.profit}</td>
                                    <td>
                                        ${!isActive ? `<span class="edit-btn" onclick="toggleEdit(${idx})">✏️</span>` : '<span style="color:rgba(255,255,255,0.06);font-size:10px;">—</span>'}
                                    </td>
                                </tr>
                                <tr id="edit-row-${idx}" class="edit-row">
                                    <td colspan="12">
                                        <div style="display:flex;flex-wrap:wrap;gap:4px;align-items:center;">
                                            <input type="text" id="edit_home_${idx}" style="width:65px;" placeholder="Хозяева">
                                            <input type="text" id="edit_away_${idx}" style="width:65px;" placeholder="Гости">
                                            <input type="text" id="edit_score_${idx}" style="width:45px;" placeholder="2-1">
                                            <input type="text" id="edit_bet_${idx}" style="width:65px;" placeholder="Ставка">
                                            <input type="number" id="edit_odds_${idx}" step="0.01" style="width:48px;" placeholder="Кэф">

        // ============================================================

        // ============================================================
        async function loadMatchAnalysis() {
            const ids = ['maTotal', 'maPassed', 'maSkipped', 'maRate', 'maNoMotivation', 'maLowPosition', 'maXGOut',
                'maTotalLabel', 'maPassedLabel', 'maSkippedLabel'
            ];
            ids.forEach(function(id) {
                document.getElementById(id).textContent = '⏳';
            });

            try {
                let response = await fetch('/api/matches_log?t=' + Date.now());
                let logText = '';

                if (response.ok) {
                    const data = await response.json();
                    logText = data.log || '';
                }

                if (logText && logText.trim() && logText.length > 50) {
                    const analyzeResponse = await fetch('/api/analyze_matches', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ log: logText })
                    });

                    const result = await analyzeResponse.json();
                    if (result.success) {
                        updateAnalysisUI(result.stats, result.recommendations);
                        return;
                    }
                }

                // Тестовые данные
                const testResponse = await fetch('/api/test_analysis');
                if (testResponse.ok) {
                    const testData = await testResponse.json();
                    if (testData.success && testData.stats.total > 0) {
                        updateAnalysisUI(testData.stats, testData.recommendations);
                        return;
                    }
                }

                resetAnalysisUI();

            } catch (error) {
                console.error('Ошибка загрузки анализа:', error);
                resetAnalysisUI();
            }
        }

        function updateAnalysisUI(stats, recommendations) {
            const total = stats.total || 0;
            const skipped = (stats.categories?.no_motivation?.count || 0) +
                (stats.categories?.low_position?.count || 0) +
                (stats.categories?.xg_out_of_range?.count || 0);
            const passed = total - skipped;

            document.getElementById('maTotal').textContent = total;
            document.getElementById('maPassed').textContent = passed;
            document.getElementById('maSkipped').textContent = skipped;
            document.getElementById('maRate').textContent = total > 0 ? ((passed / total) * 100).toFixed(1) + '%' : '0%';
            document.getElementById('maTotalLabel').textContent = total;
            document.getElementById('maPassedLabel').textContent = passed;
            document.getElementById('maSkippedLabel').textContent = skipped;
            document.getElementById('maNoMotivation').textContent = stats.categories?.no_motivation?.count || 0;
            document.getElementById('maLowPosition').textContent = stats.categories?.low_position?.count || 0;
            document.getElementById('maXGOut').textContent = stats.categories?.xg_out_of_range?.count || 0;

            const recContainer = document.getElementById('matchRecommendations');
            const recList = document.getElementById('recommendationsList');

            if (recommendations && recommendations.length > 0 && total > 0) {
                recContainer.classList.add('visible');
                recList.innerHTML = recommendations.map(function(r) {
                    return '<div class="item">' + r + '</div>';
                }).join('');
            } else {
                recContainer.classList.remove('visible');
            }
        }

        function resetAnalysisUI() {
            ['maTotal', 'maPassed', 'maSkipped', 'maNoMotivation', 'maLowPosition', 'maXGOut', 'maTotalLabel',
                'maPassedLabel', 'maSkippedLabel'
            ].forEach(function(id) {
                document.getElementById(id).textContent = '0';
            });
            document.getElementById('maRate').textContent = '0%';
            document.getElementById('matchRecommendations').classList.remove('visible');
        }

        function toggleEdit(index) {
            const row = document.getElementById('edit-row-' + index);
            if (!row) return;

            row.classList.toggle('active');

            if (row.classList.contains('active')) {
                const item = getItemByIndex(index);
                if (item) {
                    document.getElementById('edit_home_' + index).value = item.home || '';
                    document.getElementById('edit_away_' + index).value = item.away || '';
                    document.getElementById('edit_score_' + index).value = item.score || '';
                    document.getElementById('edit_bet_' + index).value = item.bet || '';
                    document.getElementById('edit_odds_' + index).value = item.odds || 0;
                    document.getElementById('edit_stake_' + index).value = item.stake || 0;
                    document.getElementById('edit_marker_' + index).value = item.marker || '';
                    document.getElementById('edit_ev_' + index).value = item.ev || 0;
                    document.getElementById('edit_result_' + index).value = item.result || 'pending';
                }
            }
        }

        function getItemByIndex(index) {
            if (!cachedData) return null;

            const history = cachedData.history || [];
            const matches = cachedData.matches || [];
            let allItems = [];

            matches.forEach(function(match) {
                const bestBet = match.best_bet || match.bets?.[0] || {};
                allItems.push({
                    type: 'match',
                    date: match.match_time || 'Сегодня',
                    home: match.home || '?',
                    away: match.away || '?',
                    score: '-',
                    bet: bestBet.label || '—',
                    odds: bestBet.odds || 0,
                    stake: bestBet.stake || 0,
                    ev: bestBet.ev || 0,
                    result: 'pending',
                    profit: 0,
                    marker: bestBet.marker_stake || '',
                    is_active: true
                });
            });

            history.forEach(function(bet) {
                allItems.push({
                    type: 'history',
                    date: bet.date || '-',
                    home: bet.home || '?',
                    away: bet.away || '?',
                    score: (bet.home_goals !== null && bet.away_goals !== null) ?
                        bet.home_goals + ' - ' + bet.away_goals :
                        '-',
                    bet: bet.bet || '—',
                    odds: bet.odds || 0,
                    stake: bet.stake || 0,
                    ev: bet.ev || 0,
                    result: bet.result || 'pending',
                    profit: bet.profit || 0,
                    marker: bet.marker_stake || '',
                    is_active: false
                });
            });

            allItems.sort(function(a, b) {
                if (a.is_active && !b.is_active) return -1;
                if (!a.is_active && b.is_active) return 1;
                try { return new Date(b.date) - new Date(a.date); } catch { return 0; }
            });

            allItems = allItems.slice(0, 50);

            return index < allItems.length ? allItems[index] : null;
        }

        function getHistoryIndex(displayIndex) {
            if (!cachedData) return null;

            const history = cachedData.history || [];
            const matches = cachedData.matches || [];
            let allItems = [];

            matches.forEach(function() {
                allItems.push({ type: 'match' });
            });

            history.forEach(function() {
                allItems.push({ type: 'history' });
            });

            allItems.sort(function(a, b) {
                if (a.is_active && !b.is_active) return -1;
                if (!a.is_active && b.is_active) return 1;
                try { return new Date(b.date) - new Date(a.date); } catch { return 0; }
            });

            allItems = allItems.slice(0, 50);

            if (displayIndex < allItems.length && allItems[displayIndex].type === 'history') {
                return history.length - 1 - allItems.slice(0, displayIndex + 1).filter(function(i) {
                    return i.type === 'history';
                }).length;
            }

            return null;
        }

        async function saveEdit(index) {
            const score = document.getElementById('edit_score_' + index).value;
            let homeGoals = null,
                awayGoals = null;

            if (score && score.includes('-')) {
                const parts = score.split('-');
                homeGoals = parseInt(parts[0].trim());
                awayGoals = parseInt(parts[1].trim());
            }

            const data = {
                home: document.getElementById('edit_home_' + index).value,
                away: document.getElementById('edit_away_' + index).value,
                home_goals: homeGoals,
                away_goals: awayGoals,
                bet: document.getElementById('edit_bet_' + index).value,
                odds: parseFloat(document.getElementById('edit_odds_' + index).value) || 0,
                stake: parseFloat(document.getElementById('edit_stake_' + index).value) || 0,
                ev: parseFloat(document.getElementById('edit_ev_' + index).value) || 0,
                marker: document.getElementById('edit_marker_' + index).value || '',
                result: document.getElementById('edit_result_' + index).value,
                index: getHistoryIndex(index)
            };

            if (data.index === null) {
                showNotification('❌ Нельзя редактировать активный матч', 'error');
                return;
            }

            try {
                const response = await fetch(API_BASE + '/api/edit_bet', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(data)
                });

                const result = await response.json();

                if (result.success) {
                    showNotification('✅ Ставка обновлена!', 'success');
                    toggleEdit(index);
                    refreshData();
                } else {
                    showNotification('❌ Ошибка: ' + result.error, 'error');
                }
            } catch (error) {
                showNotification('❌ Ошибка: ' + error, 'error');
            }
        }

            if (!confirm('Удалить эту ставку?')) return;

            const historyIndex = getHistoryIndex(index);

            if (historyIndex === null) {

                            },
                            grid: { color: gridColor }
                        }
                    },
                    onClick: function(event, elements) {
                        if (elements.length > 0) {
                            showChartDetails(elements[0].index);
                        }
                    }
                }
            });

            updateInteractiveChart();
        }

        function updateInteractiveChart() {
            if (!chartInteractive) return;

            const period = document.getElementById('chartPeriod').value;
            const type = document.getElementById('chartType').value;
            let history = window._historyData || [];

            if (period !== 'all') {
                const days = parseInt(period);
                const cutoff = new Date();
                cutoff.setDate(cutoff.getDate() - days);

                history = history.filter(function(bet) {
                    try {
                        return new Date(bet.date.split(' ')[0]) >= cutoff;
                    } catch {
                        return false;
                    }
                });
            }

            history.sort(function(a, b) {
                try {
                    return new Date(a.date) - new Date(b.date);
                } catch {
                    return 0;
                }
            });

            const labels = [];
            const values = [];
            let cumulative = 0;
            let bank = 1000;

            history.forEach(function(bet, index) {
                labels.push(bet.date);

                if (type === 'profit') {
                    cumulative += bet.profit || 0;
                    values.push(Math.round(cumulative * 100) / 100);
                } else if (type === 'bank') {
                    bank += bet.profit || 0;
                    values.push(Math.round(bank * 100) / 100);
                } else {
                    const wins = history.slice(0, index + 1).filter(function(b) { return b.result === 'win'; })
                        .length;
                    values.push(Math.round((wins / (index + 1)) * 1000) / 10);
                }
            });

            chartData = history;

            const labelsMap = {
                'profit': 'Прибыль ($)',
                'bank': 'Банк ($)',
                'winrate': 'Проходимость (%)'
            };

            chartInteractive.data.labels = labels;
            chartInteractive.data.datasets[0].data = values;
            chartInteractive.data.datasets[0].label = labelsMap[type] || 'Прибыль ($)';
            chartInteractive.update();
        }

        async function runSimulation() {
            const count = parseInt(document.getElementById('simCount').value) || 1000;
            document.getElementById('simResults').style.display = 'block';

            try {
                const response = await fetch(API_BASE + '/api/simulate', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ count: count })
                });

                const data = await response.json();

                if (data.error) {
                    showNotification('❌ Ошибка: ' + data.error, 'error');
                    return;
                }

                document.getElementById('simProfit').textContent = '$' + data.profit;
                document.getElementById('simWinrate').textContent = data.winrate + '%';
                document.getElementById('simROI').textContent = data.roi + '%';
                document.getElementById('simRisk').textContent = data.risk + '%';
                document.getElementById('simTotal').textContent = data.total;
                document.getElementById('simWins').textContent = data.wins;
                document.getElementById('simLosses').textContent = data.losses;
                document.getElementById('simMaxProfit').textContent = '$' + data.max_profit;
                document.getElementById('simMinProfit').textContent = '$' + data.min_profit;
                document.getElementById('simAvgStake').textContent = '$' + data.avg_stake;

                const recommendation = document.getElementById('simRecommendation');

                if (data.profit > 0) {
                    recommendation.innerHTML = `
                                ✅ <b style="color:#34d399;">Отличный результат!</b> Ваша стратегия принесла бы прибыль!<br>
                                💡 Средняя прибыль на ставку: $${(data.profit / data.total).toFixed(2)}<br>
                                🔥 Лучший результат: +$${data.max_profit}
                            `;
                } else {
                    recommendation.innerHTML = `
                                ⚠️ <b style="color:#f87171;">Стратегия требует улучшения</b><br>
                                💡 Попробуйте снизить сумму ставок<br>
                                📊 Работайте над проходимостью (сейчас ${data.winrate}%)
                            `;
                }

                const ctx = document.getElementById('simChart');
                if (ctx) {
                    if (chartSim) {
                        chartSim.destroy();
                        chartSim = null;
                    }

                    const isLight = document.body.classList.contains('light-theme');

                    chartSim = new Chart(ctx, {
                        type: 'line',
                        data: {
                            labels: data.labels || Array.from({ length: data.history.length }, function(_, i) { return i +
                                    1; }),
                            datasets: [{
                                label: 'Прибыль ($)',
                                data: data.history || [],
                                borderColor: data.profit > 0 ? '#34d399' : '#f87171',
                                backgroundColor: data.profit > 0 ? 'rgba(52,211,153,0.06)' :
                                    'rgba(248,113,113,0.06)',
                                fill: true,
                                tension: 0.4,
                                pointRadius: 2
                            }]
                        },
                        options: {
                            responsive: true,
                            maintainAspectRatio: false,
                            plugins: {
                                legend: {
                                    labels: {
                                        color: isLight ? 'rgba(0,0,0,0.6)' : 'rgba(255,255,255,0.6)',
                                        font: { size: 9 }
                                    }
                                }
                            },
                            scales: {
                                x: {
                                    ticks: {
                                        color: isLight ? 'rgba(0,0,0,0.25)' : 'rgba(255,255,255,0.25)',
                                        font: { size: 8 }
                                    },
                                    grid: { color: isLight ? 'rgba(0,0,0,0.05)' : 'rgba(255,255,255,0.03)' }
                                },
                                y: {
                                    ticks: {
                                        color: isLight ? 'rgba(0,0,0,0.25)' : 'rgba(255,255,255,0.25)',
                                        callback: function(value) { return '$' + value; },
                                        font: { size: 8 }
                                    },
                                    grid: { color: isLight ? 'rgba(0,0,0,0.05)' : 'rgba(255,255,255,0.03)' }
                                }
                            }
                        }
                    });
                }

            } catch (error) {
                showNotification('❌ Ошибка: ' + error, 'error');
            }
        }

        // ============================================================
        // ЭКСПОРТ/ИМПОРТ ПРОЕКТА
        // ============================================================
        function exportProject() {
            const projectData = {
                version: '1.0',
                exportDate: new Date().toISOString(),
                theme: localStorage.getItem('theme') || 'dark',
                data: cachedData || null
            };

            if (!projectData.data) {
                showNotification('⏳ Загрузка данных...', '');
                fetch(API_BASE + '/api/all_data')
                    .then(function(response) { return response.json(); })
                    .then(function(data) {
                        projectData.data = data;
                        downloadProjectFile(projectData);
                    })
                    .catch(function(error) {
                        showNotification('❌ Ошибка: ' + error, 'error');
                    });
                return;
            }

            downloadProjectFile(projectData);
        }

        function downloadProjectFile(projectData) {
            const json = JSON.stringify(projectData, null, 2);
            const blob = new Blob([json], { type: 'application/json' });
            const url = URL.createObjectURL(blob);

            const link = document.createElement('a');
            link.href = url;
            link.download = 'quantum_project_' + new Date().toISOString().slice(0, 10) + '.json';
            link.click();

            URL.revokeObjectURL(url);
            showNotification('✅ Проект сохранен!', 'success');
        }

        function importProject(event) {
            const file = event.target.files[0];
            if (!file) return;

            const reader = new FileReader();

            reader.onload = function(e) {
                try {
                    const projectData = JSON.parse(e.target.result);

                    if (!projectData.version) {
                        showNotification('❌ Неверный формат файла!', 'error');
                        return;
                    }

                    if (projectData.theme) {
                        localStorage.setItem('theme', projectData.theme);
                        if (projectData.theme === 'light') {
                            document.body.classList.add('light-theme');
                            document.getElementById('themeBtn').textContent = '☀️';
                        } else {
                            document.body.classList.remove('light-theme');
                            document.getElementById('themeBtn').textContent = '🌙';
                        }
                    }

                    if (projectData.data && projectData.data.history) {
                        showNotification('⏳ Отправка данных на сервер...', '');

                        fetch(API_BASE + '/api/import_project', {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify({
                                history: projectData.data.history,
                                stats: projectData.data.stats
                            })
                        })
                        .then(function(response) { return response.json(); })
                        .then(function(result) {
                            if (result.success) {
                                showNotification('✅ Импортировано ' + result.count + ' ставок!', 'success');
                                refreshData();
                            } else {
                                showNotification('❌ Ошибка: ' + result.error, 'error');
                            }
                        })
                        .catch(function(error) {
                            showNotification('❌ Ошибка: ' + error, 'error');
                        });
                    } else {
                        showNotification('✅ Настройки загружены!', 'success');
                        refreshData();
                    }

                } catch (error) {
                    showNotification('❌ Ошибка чтения файла: ' + error, 'error');
                }
            };

            reader.readAsText(file);
            event.target.value = '';
        }

        // ============================================================
        // ИМПОРТ EXCEL
        // ============================================================
        function importExcel(event) {
            const file = event.target.files[0];
            const statusDiv = document.getElementById('importStatus');
            const fileNameSpan = document.getElementById('fileName');

            if (!file) {
                statusDiv.textContent = '❌ Файл не выбран';
                return;
            }

            fileNameSpan.textContent = '📄 ' + file.name;
            statusDiv.textContent = '⏳ Загрузка файла...';

            const reader = new FileReader();

            reader.onload = function(e) {
                try {
                    const data = new Uint8Array(e.target.result);
                    const workbook = XLSX.read(data, { type: 'array' });
                    const sheet = workbook.Sheets[workbook.SheetNames[0]];
                    const json = XLSX.utils.sheet_to_json(sheet);

                    if (json.length === 0) {
                        statusDiv.textContent = '❌ Файл пуст или неправильный формат';
                        return;
                    }

                    statusDiv.textContent = '⏳ Отправка данных на сервер...';

                    fetch(API_BASE + '/api/import_excel', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ data: json })
                    })
                    .then(function(response) { return response.json(); })
                    .then(function(data) {
                        if (data.success) {
                            statusDiv.textContent = '✅ Импортировано ' + data.count + ' ставок! Страница обновится...';
                            setTimeout(refreshData, 1500);
                        } else {
                            statusDiv.textContent = '❌ Ошибка: ' + data.error;
                        }
                    })
                    .catch(function(error) {
                        statusDiv.textContent = '❌ Ошибка: ' + error;
                    });

                } catch (error) {
                    statusDiv.textContent = '❌ Ошибка чтения файла: ' + error;
                }
            };

            reader.readAsArrayBuffer(file);
        }

        document.getElementById('importFileInput').addEventListener('change', function() {
            if (this.files.length > 0) {
                document.getElementById('fileName').textContent = '📄 ' + this.files[0].name;
            }
        });

        // ============================================================
        // ЗАПУСК
        // ============================================================
        document.addEventListener('DOMContentLoaded', function() {
            loadPage('dashboard');
        });
    </script>
