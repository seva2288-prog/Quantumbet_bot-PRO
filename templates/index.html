<!DOCTYPE html>
<html lang="ru" data-theme="dark">
<head>
    <title>Quantum Bet Tracker</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    
    <!-- Внешние библиотеки -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-zoom@2.0.1/dist/chartjs-plugin-zoom.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
    
    <!-- Стили -->
    <link rel="stylesheet" href="/static/styles.css">
    
    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml" href="/static/favicon.svg">
    <link rel="icon" type="image/png" sizes="32x32" href="/static/favicon-32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="/static/favicon-16.png">
    <link rel="apple-touch-icon" sizes="180x180" href="/static/apple-touch-icon.png">
</head>
<body>

<!-- ============================================================
     ЭКРАН ЗАГРУЗКИ
     ============================================================ -->
<div id="loadingScreen">
    <div class="milky-way"></div>
    <div class="milky-way-2"></div>
    <div id="loadingStars" class="loading-stars"></div>
    <div class="logo">
        <div class="logo-text">QUANTUM</div>
        <div class="logo-sub">BET TRACKER</div>
        <div class="spinner"></div>
        <div class="loading-text">ЗАГРУЗКА</div>
    </div>
</div>

<!-- ============================================================
     ЗВЕЗДЫ
     ============================================================ -->
<div class="stars-container" id="starsContainer">
    <div class="milky-way"></div>
    <div class="milky-way-2"></div>
</div>

<!-- ============================================================
     ОСНОВНОЙ КОНТЕЙНЕР
     ============================================================ -->
<div class="container">
    <div class="header">
        <h1>🤖 Quantum Bet Tracker</h1>
        <div class="header-controls">
            <div class="status">
                <span class="status-dot"></span>
                <span>Система активна</span>
                <span style="color:rgba(255,255,255,0.2);">|</span>
                <span style="color:rgba(255,255,255,0.2);">v14 X2 PRO</span>
            </div>
            <button class="theme-toggle" onclick="toggleTheme()" id="themeBtn">🌙</button>
            <button class="theme-toggle" onclick="refreshData()" style="font-size:12px;">🔄</button>
        </div>
    </div>

    <!-- СТРАНИЦЫ -->
    <div id="page-dashboard" class="page active">
        <div id="dashboard-content"></div>
    </div>
    <div id="page-analysis" class="page" style="display:none;">
        <div id="analysis-content"></div>
    </div>
    <div id="page-x2" class="page" style="display:none;">
        <div id="x2-content"></div>
    </div>
    <div id="page-analytics" class="page" style="display:none;">
        <div id="analytics-content"></div>
    </div>
    <div id="page-simulator" class="page" style="display:none;">
        <div id="simulator-content"></div>
    </div>
    <div id="page-settings" class="page" style="display:none;">
        <div id="settings-content"></div>
    </div>

    <div class="footer">Quantum Bet Tracker v14 X2 PRO © 2026</div>
</div>

<!-- ============================================================
     НАВИГАЦИЯ
     ============================================================ -->
<nav class="bottom-nav" role="navigation">
    <button class="nav-item active" data-page="dashboard">
        <span class="icon">📊</span>
        <span class="label">Главная</span>
    </button>
    <button class="nav-item" data-page="analysis">
        <span class="icon">🔍</span>
        <span class="label">Анализ</span>
    </button>
    <button class="nav-item" data-page="x2">
        <span class="icon">🔥</span>
        <span class="label">X2</span>
    </button>
    <button class="nav-item" data-page="analytics">
        <span class="icon">📈</span>
        <span class="label">Аналитика</span>
    </button>
    <button class="nav-item" data-page="simulator">
        <span class="icon">🎲</span>
        <span class="label">Симулятор</span>
    </button>
    <button class="nav-item" data-page="settings">
        <span class="icon">⚙️</span>
        <span class="label">Настройки</span>
    </button>
</nav>

<!-- ============================================================
     МОДАЛЬНОЕ ОКНО ДЛЯ X2
     ============================================================ -->
<div class="modal-overlay" id="x2Modal">
    <div class="modal">
        <div class="modal-header">
            <h3 id="x2ModalTitle">➕ Добавить X2 матч</h3>
            <button class="modal-close" onclick="closeX2Modal()">✖</button>
        </div>
        <div id="x2ModalBody">
            <div class="modal-field">
                <label>📅 Дата</label>
                <input type="date" id="x2Date">
            </div>
            <div class="modal-field">
                <label>🏟️ Матч</label>
                <input type="text" id="x2Match" placeholder="Al-Ettifaq vs Al-Faisaly">
            </div>
            <div class="modal-field">
                <div class="row">
                    <div>
                        <label>🏆 Фаворит</label>
                        <input type="text" id="x2Favorite" placeholder="Al-Ettifaq">
                    </div>
                    <div>
                        <label>📉 Аутсайдер</label>
                        <input type="text" id="x2Underdog" placeholder="Al-Faisaly">
                    </div>
                </div>
            </div>
            <div class="modal-field">
                <div class="row">
                    <div>
                        <label>📊 Коэффициент X2</label>
                        <input type="number" id="x2Odds" step="0.01" placeholder="2.00">
                    </div>
                    <div>
                        <label>💰 Сумма</label>
                        <input type="number" id="x2Stake" step="0.5" placeholder="100">
                    </div>
                </div>
            </div>
            <div class="modal-field">
                <div class="row">
                    <div>
                        <label>⚽ Счёт</label>
                        <input type="text" id="x2Score" placeholder="0:0">
                    </div>
                    <div>
                        <label>📊 Результат</label>
                        <select id="x2Result">
                            <option value="pending">⏳ PENDING</option>
                            <option value="win">✅ WIN</option>
                            <option value="loss">❌ LOSS</option>
                            <option value="push">🔄 PUSH</option>
                        </select>
                    </div>
                </div>
            </div>
            <div class="modal-field">
                <label>📝 Примечание</label>
                <input type="text" id="x2Note" placeholder="Нет мотивации у фаворита">
            </div>
            <div class="modal-actions">
                <button class="btn btn-success" onclick="saveX2Match()">💾 Сохранить</button>
                <button class="btn btn-outline" onclick="closeX2Modal()">Отмена</button>
            </div>
        </div>
    </div>
</div>

<!-- ============================================================
     МОДАЛЬНОЕ ОКНО ДЛЯ ИМПОРТА X2 EXCEL
     ============================================================ -->
<div class="modal-overlay" id="x2ImportModal">
    <div class="modal">
        <div class="modal-header">
            <h3>📤 Импорт X2 из Excel</h3>
            <button class="modal-close" onclick="closeX2ImportModal()">✖</button>
        </div>
        <div class="modal-field">
            <label>📁 Выберите файл Excel</label>
            <input type="file" id="x2ImportFile" accept=".xlsx,.xls,.csv" style="padding:8px;">
        </div>
        <div style="font-size:10px;color:rgba(255,255,255,0.3);padding:8px 0;">
            📋 Формат: Дата | Матч | Фаворит | Аутсайдер | Кэф X2 | Сумма | Счёт | Результат | Примечание
        </div>
        <div id="x2ImportStatus" style="font-size:10px;color:rgba(255,255,255,0.3);margin-bottom:8px;"></div>
        <div class="modal-actions">
            <button class="btn btn-success" onclick="importX2Excel()">📤 Импортировать</button>
            <button class="btn btn-outline" onclick="closeX2ImportModal()">Отмена</button>
        </div>
    </div>
</div>

<!-- ============================================================
     МОДАЛЬНОЕ ОКНО ДЛЯ МАТЧЕЙ
     ============================================================ -->
<div class="modal-overlay" id="addMatchModal">
    <div class="modal">
        <div class="modal-header">
            <h3>➕ Добавить матч</h3>
            <button class="modal-close" onclick="hideAddMatchModal()">✖</button>
        </div>
        <div class="modal-field">
            <label>🏟️ Название матча</label>
            <input type="text" id="matchNameInput" placeholder="Например: Real Madrid vs Barcelona">
        </div>
        <div class="modal-field">
            <label>⚽ Счёт</label>
            <input type="text" id="matchScoreInput" placeholder="2-1">
        </div>
        <div class="modal-field">
            <label>📊 Ставка</label>
            <input type="text" id="matchBetInput" placeholder="ТМ 2.5">
        </div>
        <div class="modal-field">
            <div class="row">
                <div>
                    <label>💰 Коэффициент</label>
                    <input type="number" id="matchOddsInput" value="1.85" step="0.01">
                </div>
                <div>
                    <label>💵 Сумма</label>
                    <input type="number" id="matchStakeInput" value="42.87" step="0.01">
                </div>
            </div>
        </div>
        <div class="modal-field">
            <label>📊 Результат</label>
            <select id="matchResultSelect">
                <option value="win">✅ WIN (Выигрыш)</option>
                <option value="loss">❌ LOSS (Проигрыш)</option>
                <option value="push">🔄 PUSH (Возврат)</option>
                <option value="pending">⏳ PENDING (Ожидание)</option>
            </select>
        </div>
        <div class="modal-actions">
            <button class="btn btn-success" onclick="saveManualMatch()">💾 Сохранить</button>
            <button class="btn btn-outline" onclick="hideAddMatchModal()">Отмена</button>
        </div>
    </div>
</div>

<!-- ============================================================
     СКРИПТЫ
     ============================================================ -->
<script src="/static/app.js"></script>
</body>
</html>
