        #loadingScreen {
            position: fixed;

            height: 100%;
            background: #050510;
            display: flex;
            flex-direction: column;

            z-index: 99999;
            transition: opacity 0.8s ease;
            overflow: hidden;
        }
        #loadingScreen .milky-way {
            position: absolute;
            top: -20%;
            left: -10%;
            width: 120%;
            height: 140%;
            background: radial-gradient(ellipse at 40% 50%, 
                rgba(100, 80, 180, 0.06) 0%, 
                rgba(60, 40, 120, 0.04) 20%, 
                rgba(30, 20, 80, 0.02) 50%,
                transparent 80%);
            transform: rotate(-15deg);
            filter: blur(60px);
            animation: loadingMilkyPulse 12s ease-in-out infinite alternate;
        }
        #loadingScreen .milky-way-2 {
            position: absolute;
            bottom: -10%;
            right: -10%;
            width: 100%;
            height: 120%;
            background: radial-gradient(ellipse at 60% 40%, 
                rgba(140, 100, 200, 0.04) 0%,

            filter: blur(80px);

            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            width: 92%;
            max-width: 480px;
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(30px) saturate(180%);
            -webkit-backdrop-filter: blur(30px) saturate(180%);
            border-radius: 28px;
            border: 1px solid rgba(255, 255, 255, 0.15);
            box-shadow: 
                0 8px 32px rgba(0, 0, 0, 0.5),
                inset 0 1px 0 rgba(255, 255, 255, 0.1);
            display: flex;
            justify-content: space-around;
            align-items: center;
            padding: 10px 8px;
            z-index: 1000;
            transition: all 0.3s ease;
        }
        
        body:not(.light-theme) .bottom-nav {
            background: rgba(20, 20, 35, 0.5);
            backdrop-filter: blur(30px) saturate(180%);
            -webkit-backdrop-filter: blur(30px) saturate(180%);
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 
                0 8px 32px rgba(0, 0, 0, 0.5),
                inset 0 1px 0 rgba(255, 255, 255, 0.05);
        }
        
        body.light-theme .bottom-nav {
            background: rgba(255, 255, 255, 0.5);
            backdrop-filter: blur(30px) saturate(180%);
            -webkit-backdrop-filter: blur(30px) saturate(180%);
            border: 1px solid rgba(255, 255, 255, 0.3);
            box-shadow: 
                0 8px 32px rgba(0, 0, 0, 0.1),
                inset 0 1px 0 rgba(255, 255, 255, 0.5);
        }
        
        .bottom-nav .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-decoration: none;
            color: rgba(255, 255, 255, 0.4);
            font-size: 11px;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            padding: 8px 18px;
            border-radius: 18px;
            border: none;
            background: transparent;
            cursor: pointer;
            min-width: 64px;
            position: relative;
            -webkit-tap-highlight-color: transparent;
            user-select: none;
            gap: 4px;
        }
        
        .bottom-nav .nav-item .icon {
            font-size: 26px;
            line-height: 1.2;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }
        
        .bottom-nav .nav-item .label {
            font-size: 10px;
            font-weight: 600;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            opacity: 0.6;
        }
        
        .bottom-nav .nav-item.active {
            color: #a78bfa;
            background: rgba(167, 139, 250, 0.12);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
        }
        
        .bottom-nav .nav-item.active .icon {
            transform: scale(1.05);
            text-shadow: 0 0 20px rgba(167, 139, 250, 0.3);
        }
        
        .bottom-nav .nav-item.active .label {
            opacity: 1;
            color: #a78bfa;
        }
        
        body.light-theme .bottom-nav .nav-item.active {
            background: rgba(124, 58, 237, 0.08);
            color: #7c3aed;
        }
        
        body.light-theme .bottom-nav .nav-item.active .label {
            color: #7c3aed;
        }
        
        .bottom-nav .nav-item.active::before {
            content: '';
            position: absolute;
            top: -1px;
            left: 50%;
            transform: translateX(-50%);
            width: 20px;
            height: 3px;
            background: linear-gradient(90deg, #7c3aed, #a78bfa);
            border-radius: 4px;
            box-shadow: 0 0 20px rgba(124, 58, 237, 0.3);
        }
        
        body.light-theme .bottom-nav .nav-item.active::before {
            background: linear-gradient(90deg, #6d28d9, #7c3aed);
        }
        
        .bottom-nav .nav-item:active {
            transform: scale(0.88);
            transition: transform 0.1s;
        }
        
        .bottom-nav .nav-item:hover {
            color: rgba(255, 255, 255, 0.7);
        }
        
        body.light-theme .bottom-nav .nav-item:hover {
            color: rgba(0, 0, 0, 0.6);
        }
        
        .bottom-nav::after {
            content: '';
            position: absolute;
            top: 1px;
            left: 15%;
            right: 15%;
            height: 30%;
            background: linear-gradient(180deg, rgba(255,255,255,0.15) 0%, transparent 100%);
            border-radius: 50%;
            pointer-events: none;
            opacity: 0.5;
        }
        
        body.light-theme .bottom-nav::after {
            background: linear-gradient(180deg, rgba(255,255,255,0.4) 0%, transparent 100%);
        }
        
        .bottom-nav::before {
            content: '';
            position: absolute;
            bottom: -8px;
            left: 10%;
            right: 10%;
            height: 20px;
            background: radial-gradient(ellipse at 50% 100%, rgba(0,0,0,0.2) 0%, transparent 70%);
            border-radius: 50%;
            filter: blur(10px);
            pointer-events: none;
            opacity: 0.3;
        }
        
        body.light-theme .bottom-nav::before {
            opacity: 0.1;
        }
        
        @media (max-width: 768px) {
            .bottom-nav {
                bottom: 16px;
                width: 94%;

            }

<script>
    // ============================================================
    // КОНФИГУРАЦИЯ
    // ============================================================
    const API_BASE = window.location.origin;
    
    // ============================================================
    // ЗВЁЗДЫ ДЛЯ ЭКРАНА ЗАГРУЗКИ
    // ============================================================
    (function generateLoadingStars() {
        const container = document.getElementById('loadingStars');
        if (!container) return;
        const count = 150;
        for (let i = 0; i < count; i++) {
            const star = document.createElement('div');

            star.style.opacity = 0.3 + Math.random() * 0.7;
            container.appendChild(star);
        }
    })();

    // ============================================================
    // СКРЫТИЕ ЭКРАНА ЗАГРУЗКИ
    // ============================================================
    function hideLoadingScreen() {
        const loading = document.getElementById('loadingScreen');
        if (loading) {
            loading.style.opacity = '0';
            setTimeout(function() {
                loading.style.display = 'none';
            }, 800);
        }
    }

    window.addEventListener('load', function() {
        setTimeout(hideLoadingScreen, 600);
        loadPageData('dashboard');
        startKeepAlive();
        startAutoImportX2();
        registerPWA();
    });

    // ============================================================
    // PWA РЕГИСТРАЦИЯ
    // ============================================================
    function registerPWA() {
        // Проверяем поддержку Service Worker
        if ('serviceWorker' in navigator) {
            // Регистрируем Service Worker
            navigator.serviceWorker.register('/sw.js')
                .then((registration) => {
                    console.log('✅ Service Worker зарегистрирован:', registration);
                    
                    // Проверяем обновления
                    registration.addEventListener('updatefound', () => {
                        const newWorker = registration.installing;
                        console.log('🔄 Обновление Service Worker...');
                        
                        newWorker.addEventListener('statechange', () => {
                            if (newWorker.state === 'installed' && navigator.serviceWorker.controller) {
                                console.log('🔄 Новая версия готова');
                                showUpdateBanner();
                            }
                        });
                    });
                })
                .catch((error) => {
                    console.warn('⚠️ Ошибка регистрации Service Worker:', error);
                });
            
            // Отслеживаем изменения
            let refreshing = false;
            navigator.serviceWorker.addEventListener('controllerchange', () => {
                if (refreshing) return;
                refreshing = true;
                console.log('🔄 Обновление страницы...');
                window.location.reload();
            });
        } else {
            console.warn('⚠️ Service Worker не поддерживается');
        }

        // Проверяем, установлено ли приложение
        if (window.matchMedia('(display-mode: standalone)').matches) {
            console.log('📱 Приложение запущено в режиме PWA');
            document.body.classList.add('pwa-mode');
        }

        // Обработка установки PWA
        let deferredPrompt = null;
        window.addEventListener('beforeinstallprompt', (e) => {
            e.preventDefault();
            deferredPrompt = e;
            console.log('📲 Приложение можно установить');
            showInstallBanner();
        });

        window.addEventListener('appinstalled', () => {
            console.log('✅ Приложение установлено!');
            hideInstallBanner();
            showNotification('✅ Приложение успешно установлено!', 'success');
        });
    }

    // ============================================================
    // БАННЕРЫ ДЛЯ УСТАНОВКИ И ОБНОВЛЕНИЯ PWA
    // ============================================================
    let deferredPrompt = null;

    function showInstallBanner() {
        const existing = document.getElementById('pwa-install-banner');
        if (existing) return;
        
        const banner = document.createElement('div');
        banner.id = 'pwa-install-banner';
        banner.innerHTML = `
            <div style="display:flex;align-items:center;gap:12px;flex:1;">
                <span style="font-size:24px;">📲</span>
                <div>
                    <div style="font-weight:600;font-size:14px;">Установить приложение</div>
                    <div style="font-size:11px;color:rgba(255,255,255,0.4);">Добавьте на главный экран</div>
                </div>
            </div>
            <div style="display:flex;gap:6px;">
                <button onclick="installPWA()" style="
                    background: linear-gradient(135deg, #7c3aed, #6d28d9);
                    border: none;
                    color: white;
                    padding: 8px 16px;
                    border-radius: 10px;
                    font-size: 12px;
                    font-weight: 600;
                    cursor: pointer;
                    transition: all 0.3s ease;
                ">Установить</button>
                <button onclick="hideInstallBanner()" style="
                    background: transparent;
                    border: none;
                    color: rgba(255,255,255,0.3);
                    font-size: 18px;
                    cursor: pointer;
                    padding: 4px 8px;
                ">✖</button>
            </div>
        `;
        
        document.body.appendChild(banner);
    }

    window.installPWA = function() {
        if (deferredPrompt) {
            deferredPrompt.prompt();
            deferredPrompt.userChoice.then((choiceResult) => {
                if (choiceResult.outcome === 'accepted') {
                    console.log('✅ Пользователь установил приложение');
                } else {
                    console.log('❌ Пользователь отклонил установку');
                }
                deferredPrompt = null;
                hideInstallBanner();
            });
        }
    };

    window.hideInstallBanner = function() {
        const banner = document.getElementById('pwa-install-banner');
        if (banner) {
            banner.style.animation = 'slideDown 0.3s ease';
            setTimeout(() => banner.remove(), 300);
        }
    };

    function showUpdateBanner() {
        const existing = document.getElementById('pwa-update-banner');
        if (existing) return;
        
        const banner = document.createElement('div');
        banner.id = 'pwa-update-banner';
        banner.innerHTML = `
            <div style="display:flex;align-items:center;gap:10px;flex:1;">
                <span style="font-size:20px;">🔄</span>
                <div>
                    <div style="font-weight:600;font-size:13px;">Доступно обновление</div>
                    <div style="font-size:10px;color:rgba(255,255,255,0.4);">Нажмите для обновления приложения</div>
                </div>
            </div>
            <button onclick="updatePWA()" style="
                background: linear-gradient(135deg, #34d399, #059669);
                border: none;
                color: white;
                padding: 8px 16px;
                border-radius: 10px;
                font-size: 12px;
                font-weight: 600;
                cursor: pointer;
                transition: all 0.3s ease;
            ">Обновить</button>
        `;
        
        document.body.appendChild(banner);
    }

    window.updatePWA = function() {
        navigator.serviceWorker.ready.then((registration) => {
            registration.waiting?.postMessage({ type: 'SKIP_WAITING' });
        });
        const banner = document.getElementById('pwa-update-banner');
        if (banner) banner.remove();
    };

    // ============================================================
    // KEEP-ALIVE — приложение само себя будит
    // ============================================================
    function startKeepAlive() {
        keepAliveInterval = setInterval(function() {
            fetch(API_BASE + '/api/all_data?t=' + Date.now())
                .then(response => response.json())
                .then(data => {
                    console.log('🔄 Keep-Alive: пинг успешен', new Date().toLocaleTimeString());
                    updateKeepAliveStatus('✅', new Date().toLocaleTimeString());
                    if (cachedData) {
                        cachedData = data;
                    }
                    fetch(API_BASE + '/api/keepalive?t=' + Date.now()).catch(() => {});
                })
                .catch(err => {
                    console.warn('⚠️ Keep-Alive: пинг не удался', err);
                    updateKeepAliveStatus('❌', new Date().toLocaleTimeString());
                });
        }, 180000);

        const statusEl = document.createElement('div');
        statusEl.id = 'keepAliveStatus';
        statusEl.textContent = '🔄 Автопинг активен';
        document.body.appendChild(statusEl);
        
        setTimeout(function() {
            fetch(API_BASE + '/api/keepalive?t=' + Date.now()).catch(() => {});
        }, 5000);
    }

    function updateKeepAliveStatus(icon, time) {
        const el = document.getElementById('keepAliveStatus');
        if (el) {
            el.textContent = icon + ' ' + time;
        }
    }

    // ============================================================
    // АВТО-ИМПОРТ X2 ИЗ ЛОГОВ БОТА
    // ============================================================
    function startAutoImportX2() {
        autoImportInterval = setInterval(function() {
            autoImportX2FromLogs();
        }, 180000);
        setTimeout(function() {
            autoImportX2FromLogs();
        }, 5000);
    }

    async function autoImportX2FromLogs() {
        try {
            console.log('🤖 Авто-импорт X2 из логов...');
            const response = await fetch(API_BASE + '/api/matches_log?t=' + Date.now());
            if (!response.ok) {
                console.warn('⚠️ Не удалось получить логи');
                return;
            }
            const data = await response.json();
            const logText = data.log || '';
            if (!logText || logText.trim() === '') {
                console.log('📭 Логи пусты');
                return;
            }
            const lines = logText.split('\n');
            let newMatches = 0;
            let totalFound = 0;
            
            for (const line of lines) {
                if (line.includes('нет мотивации') || line.includes('no motivation')) {
                    totalFound++;
                    const matchMatch = line.match(/([A-Za-z\s]+)\s+vs\s+([A-Za-z\s]+)/i);
                    if (!matchMatch) continue;
                    const home = matchMatch[1].trim();
                    const away = matchMatch[2].trim();
                    const matchName = home + ' vs ' + away;
                    const today = new Date().toISOString().slice(0,10);
                    const exists = x2Data.some(m => m.match === matchName && m.date === today);
                    if (exists) continue;
                    const xgMatch = line.match(/XG:\s*([\d.]+)/i);
                    const xg = xgMatch ? parseFloat(xgMatch[1]) : null;
                    let favorite = home;
                    let underdog = away;
                    const posMatch = line.match(/H:\s*#(\d+),\s*A:\s*#(\d+)/i);
                    if (posMatch) {
                        const homePos = parseInt(posMatch[1]);
                        const awayPos = parseInt(posMatch[2]);
                        if (homePos < awayPos) {
                            favorite = home;
                            underdog = away;
                        } else {
                            favorite = away;
                            underdog = home;
                        }
                    }
                    const newMatch = {
                        id: Date.now() + Math.random() * 1000 + newMatches,
                        date: today,
                        match: matchName,
                        favorite: favorite,
                        underdog: underdog,
                        odds: 0,
                        stake: 0,
                        score: '-',
                        result: 'pending',
                        profit: 0,
                        note: 'Авто-импорт из логов бота' + (xg ? ' | XG: ' + xg : '')
                    };
                    x2Data.push(newMatch);
                    newMatches++;
                }
            }
            
            if (newMatches > 0) {
                saveX2Data();
                showNotification('🤖 Добавлено ' + newMatches + ' X2 матчей из логов!', 'success');
                if (currentPage === 'x2') renderX2Page();
                if (currentPage === 'dashboard') loadPageData('dashboard');
            } else if (totalFound > 0) {
                console.log('📭 Найдено ' + totalFound + ' матчей с "нет мотивации", но все уже добавлены');
            } else {
                console.log('📭 Матчей с "нет мотивации" в логах не найдено');
            }
        } catch (error) {
            console.error('❌ Ошибка авто-импорта X2:', error);
        }
    }

    // ============================================================
    // ЗВЁЗДЫ ДЛЯ ОСНОВНОГО ФОНА
    // ============================================================
    (function generateStars() {
        const container = document.getElementById('starsContainer');
        const count = 250;
        for (let i = 0; i < count; i++) {
            const star = document.createElement('div');
            star.className = 'star';
            const size = 0.5 + Math.random() * 2.5;
            star.style.width = size + 'px';
            star.style.height = size + 'px';
            star.style.left = Math.random() * 100 + '%';
            star.style.top = Math.random() * 100 + '%';
            star.style.setProperty('--duration', (2 + Math.random() * 4) + 's');
            star.style.animationDelay = (Math.random() * 5) + 's';
            star.style.opacity = 0.3 + Math.random() * 0.7;
            container.appendChild(star);
        }
    })();

    // ============================================================
    // ПЕРЕМЕННЫЕ
    // ============================================================
    let cachedData = null;
    let chartInstance = null;

    function showNotification(message, type) {
        const notification = document.createElement('div');
        notification.className = 'notification' + (type === 'success' ? ' success' : type === 'error' ? ' error' : '');
        notification.textContent = message;
        document.body.appendChild(notification);
        setTimeout(() => {
            notification.style.animation = 'slideOut 0.3s ease';
            setTimeout(() => {
                if (notification.parentNode) {
                    notification.remove();
                }
            }, 300);
        }, 3000);

    function switchPage(page) {
        if (page === currentPage) return;
        document.querySelectorAll('.bottom-nav .nav-item').forEach(b => b.classList.remove('active'));
        document.querySelector(`.bottom-nav .nav-item[data-page="${page}"]`).classList.add('active');
        document.querySelectorAll('.page').forEach(p => {
            p.style.display = 'none';
            p.classList.remove('active');
        });
        const targetPage = document.getElementById('page-' + page);
        if (targetPage) {
            targetPage.style.display = 'block';
            targetPage.classList.add('active');
        }
        currentPage = page;
        loadPageData(page);
    }

    // ============================================================
    // ЗАГРУЗКА ДАННЫХ
    // ============================================================
    async function loadPageData(page) {
        if (isLoading) return;
        const contentId = page + '-content';
        const contentEl = document.getElementById(contentId);
        if (page !== 'dashboard' && cachedData && contentEl.innerHTML && page !== 'x2') {
            return;
        }
        isLoading = true;
        if (page !== 'x2') {
            contentEl.innerHTML = '<div class="loader active"><div class="spinner"></div><div style="color:rgba(255,255,255,0.4);font-size:12px;margin-top:6px;">Загрузка...</div></div>';
        }
        try {
            const response = await fetch(API_BASE + '/api/x2_matches?t=' + Date.now());
            if (!response.ok) {
                throw new Error('Сервер вернул ошибку: ' + response.status);
            }
            const data = await response.json();
            try {
                const matchesData = await loadMatches();
                if (matchesData && matchesData.length > 0) {
                    data.matches = matchesData;
                    console.log('✅ Загружено матчей:', matchesData.length);
                }
            } catch (e) {
                console.log('Матчи не загружены отдельно');
            }
            cachedData = data;
            switch(page) {
                case 'dashboard': renderDashboard(data); break;
                case 'x2': renderX2Page(); break;
                case 'settings': renderSettings(data); break;
            }
            hideLoadingScreen();
        } catch (error) {
            console.error('Ошибка загрузки:', error);
            if (page !== 'x2') {
                contentEl.innerHTML = `
                    <div class="no-data">
                        <div class="emoji">⚠️</div>
                        <div>Ошибка загрузки данных!</div>
                        <div style="font-size:11px;color:rgba(255,255,255,0.3);margin-top:4px;">
                            ${error.message}
                        </div>
                        <button onclick="refreshData()" style="margin-top:8px;padding:6px 16px;background:rgba(124,58,237,0.2);border:1px solid rgba(124,58,237,0.3);border-radius:6px;color:#a78bfa;cursor:pointer;">
                            🔄 Повторить
                        </button>
                    </div>
                `;
            }
            hideLoadingScreen();
            showNotification('❌ Ошибка загрузки: ' + error.message, 'error');
        }
        isLoading = false;
    }

    function refreshData() {
        cachedData = null;
        matchesCache = null;
        loadPageData(currentPage);
        showNotification('🔄 Обновление данных...', '');
    }

    async function loadMatches() {
        try {
            const response = await fetch(API_BASE + '/api/matches?t=' + Date.now());
            if (response.ok) {
                const data = await response.json();
                matchesCache = data;
                return data;
            }
            return null;
        } catch (e) {
            console.log('Ошибка загрузки матчей:', e);
            return null;
        }
    }

    function getItemByIndex(index) {
        if (!cachedData) return null;
        const history = cachedData.history || [];
        const matches = cachedData.matches || [];
        let allItems = [];
        if (matches && matches.length > 0) {
            matches.forEach((match) => {
                const bestBet = match.best_bet || match.bets?.[0] || {};
                allItems.push({
                    type: 'match',
                    date: match.match_time || 'Сегодня',
                    home: match.home || 'Unknown',
                    away: match.away || 'Unknown',
                    score: '-',
                    bet: bestBet.label || '—',
                    odds: bestBet.odds || 0,
                    stake: bestBet.stake || 0,
                    ev: bestBet.ev || 0,
                    result: 'pending',
                    profit: 0,
                    marker: bestBet.marker_stake || '',
                    is_active: true
                });
            });
        }
        if (history && history.length > 0) {
            history.forEach((bet) => {
                allItems.push({
                    type: 'history',
                    date: bet.date || '-',
                    home: bet.home || 'Unknown',
                    away: bet.away || 'Unknown',
                    score: (bet.home_goals !== null && bet.away_goals !== null) ? bet.home_goals + ' - ' + bet.away_goals : '-',
                    bet: bet.bet || '—',
                    odds: bet.odds || 0,
                    stake: bet.stake || 0,
                    ev: bet.ev || 0,
                    result: bet.result || 'pending',
                    profit: bet.profit || 0,
                    marker: bet.marker_stake || '',
                    is_active: false
                });
            });
        }
        allItems.sort((a, b) => {
            if (a.is_active && !b.is_active) return -1;
            if (!a.is_active && b.is_active) return 1;
            try { return new Date(b.date) - new Date(a.date); } catch { return 0; }
        });
        allItems = allItems.slice(0, 50);
        if (index < allItems.length) {
            return allItems[index];
        }
        return null;
    }

    async function saveEdit(index) {
        const score = document.getElementById('edit_score_' + index).value;
        let home_goals = null, away_goals = null;
        if (score && score.includes('-')) {
            const parts = score.split('-');
            home_goals = parseInt(parts[0].trim());
            away_goals = parseInt(parts[1].trim());
        }
        const data = {
            home: document.getElementById('edit_home_' + index).value,
            away: document.getElementById('edit_away_' + index).value,
            home_goals: home_goals,
            away_goals: away_goals,
            bet: document.getElementById('edit_bet_' + index).value,
            odds: parseFloat(document.getElementById('edit_odds_' + index).value) || 0,
            stake: parseFloat(document.getElementById('edit_stake_' + index).value) || 0,
            ev: parseFloat(document.getElementById('edit_ev_' + index).value) || 0,
            marker: document.getElementById('edit_marker_' + index).value || '',
            result: document.getElementById('edit_result_' + index).value,
            index: getHistoryIndex(index)
        };
        if (data.index === null) {
            showNotification('❌ Нельзя редактировать активный матч', 'error');
            return;
        }
        try {
            const response = await fetch(API_BASE + '/api/edit_bet', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(data)
            });
            const result = await response.json();
            if (result.success) {
                showNotification('✅ Ставка обновлена!', 'success');
                toggleEdit(index);
                refreshData();
            } else {
                showNotification('❌ Ошибка: ' + result.error, 'error');
            }
        } catch (e) {
            showNotification('❌ Ошибка: ' + e, 'error');
        }
    }

    // ============================================================
    // X2 ФУНКЦИИ
    // ============================================================
    function calcX2Stats() {
        const total = x2Data.length;
        const wins = x2Data.filter(m => m.result === 'win').length;
        const losses = x2Data.filter(m => m.result === 'loss').length;
        const pushes = x2Data.filter(m => m.result === 'push').length;
        const pending = x2Data.filter(m => m.result === 'pending').length;
        const totalProfit = x2Data.reduce((sum, m) => sum + (m.result === 'win' ? m.profit : m.result === 'loss' ? -m.stake : 0), 0);
        const totalStake = x2Data.reduce((sum, m) => sum + m.stake, 0);
        const winrate = total > 0 ? Math.round((wins / total) * 100) : 0;
        const roi = totalStake > 0 ? Math.round((totalProfit / totalStake) * 100) : 0;
        return { total, wins, losses, pushes, pending, totalProfit, winrate, roi };
    }

    function getFilteredX2() {
        if (currentFilter === 'all') return [...x2Data];
        return x2Data.filter(m => m.result === currentFilter);
    }

    function setX2Filter(filter) {
        currentFilter = filter;
        renderX2Page();
    }

    function openX2Modal(data) {
        const modal = document.getElementById('x2Modal');
        const title = document.getElementById('x2ModalTitle');
        if (data) {
            title.textContent = '✏️ Редактировать X2 матч';
            document.getElementById('x2Date').value = data.date || '';
            document.getElementById('x2Match').value = data.match || '';
            document.getElementById('x2Favorite').value = data.favorite || '';
            document.getElementById('x2Underdog').value = data.underdog || '';
            document.getElementById('x2Odds').value = data.odds || '';
            document.getElementById('x2Stake').value = data.stake || '';
            document.getElementById('x2Score').value = data.score || '';
            document.getElementById('x2Result').value = data.result || 'pending';
            document.getElementById('x2Note').value = data.note || '';
            editingX2Index = x2Data.indexOf(data);
        } else {
            title.textContent = '➕ Добавить X2 матч';
            document.getElementById('x2Date').value = new Date().toISOString().slice(0,10);
            document.getElementById('x2Match').value = '';
            document.getElementById('x2Favorite').value = '';
            document.getElementById('x2Underdog').value = '';
            document.getElementById('x2Odds').value = '';
            document.getElementById('x2Stake').value = '';
            document.getElementById('x2Score').value = '';
            document.getElementById('x2Result').value = 'pending';
            document.getElementById('x2Note').value = '';
            editingX2Index = null;
        }
        modal.classList.add('active');
    }

    function closeX2Modal() {
        document.getElementById('x2Modal').classList.remove('active');
        editingX2Index = null;
    }

    function saveX2Match() {
        const date = document.getElementById('x2Date').value;
        const match = document.getElementById('x2Match').value.trim();
        const favorite = document.getElementById('x2Favorite').value.trim();
        const underdog = document.getElementById('x2Underdog').value.trim();
        const odds = parseFloat(document.getElementById('x2Odds').value);
        const stake = parseFloat(document.getElementById('x2Stake').value);
        const score = document.getElementById('x2Score').value.trim();
        const result = document.getElementById('x2Result').value;
        const note = document.getElementById('x2Note').value.trim();

        if (!match || !favorite || !underdog || !odds || !stake) {
            showNotification('❌ Заполните все обязательные поля!', 'error');
            return;
        }

        let profit = 0;
        if (result === 'win') profit = Math.round((stake * odds - stake) * 100) / 100;
        else if (result === 'loss') profit = -stake;
        else if (result === 'push') profit = 0;

        const data = { date, match, favorite, underdog, odds, stake, score, result, profit, note };

        if (editingX2Index !== null && editingX2Index >= 0 && editingX2Index < x2Data.length) {
            x2Data[editingX2Index] = { ...x2Data[editingX2Index], ...data };
            showNotification('✅ X2 матч обновлен!', 'success');
        } else {
            data.id = Date.now();
            x2Data.push(data);
            showNotification('✅ X2 матч добавлен!', 'success');
        }

        saveX2Data();
        closeX2Modal();
        renderX2Page();
        if (currentPage === 'dashboard') loadPageData('dashboard');
    }

        if (index >= 0 && index < x2Data.length) {

    function deleteX2Match(index) {
        if (index >= 0 && index < x2Data.length) {

    function openX2ImportModal() {
        document.getElementById('x2ImportModal').classList.add('active');

    function importX2Excel() {
        const fileInput = document.getElementById('x2ImportFile');
        const statusEl = document.getElementById('x2ImportStatus');
        
        if (!fileInput.files || fileInput.files.length === 0) {
            statusEl.textContent = '❌ Выберите файл!';
            statusEl.style.color = '#f87171';
            return;
        }
        
        const file = fileInput.files[0];
        statusEl.textContent = '⏳ Чтение файла...';
        statusEl.style.color = 'rgba(255,255,255,0.3)';
        
        const reader = new FileReader();
        reader.onload = function(e) {
            try {
                const data = new Uint8Array(e.target.result);
                const workbook = XLSX.read(data, { type: 'array' });
                const sheet = workbook.Sheets[workbook.SheetNames[0]];
                const json = XLSX.utils.sheet_to_json(sheet);
                
                if (json.length === 0) {
                    statusEl.textContent = '❌ Файл пуст!';
                    statusEl.style.color = '#f87171';
                    return;
                }
                
                let imported = 0;
                let errors = 0;
                
                json.forEach(row => {
                    try {
                        const match = row['Матч'] || row['match'] || '';
                        const favorite = row['Фаворит'] || row['favorite'] || '';
                        const underdog = row['Аутсайдер'] || row['underdog'] || '';
                        const odds = parseFloat(row['Кэф X2'] || row['odds'] || 0);
                        const stake = parseFloat(row['Сумма'] || row['stake'] || 0);
                        const date = row['Дата'] || row['date'] || new Date().toISOString().slice(0,10);
                        const score = row['Счёт'] || row['score'] || '-';
                        const result = (row['Результат'] || row['result'] || 'pending').toLowerCase();
                        const note = row['Примечание'] || row['note'] || '';
                        
                        if (!match || !favorite || !underdog) {
                            errors++;
                            return;
                        }
                        
                        const exists = x2Data.some(m => m.match === match && m.date === date);
                        if (exists) {
                            errors++;
                            return;
                        }
                        
                        let profit = 0;
                        if (result === 'win') profit = Math.round((stake * odds - stake) * 100) / 100;
                        else if (result === 'loss') profit = -stake;
                        else if (result === 'push') profit = 0;
                        
                        x2Data.push({
                            id: Date.now() + Math.random() * 1000 + imported,
                            date: date,
                            match: match,
                            favorite: favorite,
                            underdog: underdog,
                            odds: odds,
                            stake: stake,
                            score: score,
                            result: result,
                            profit: profit,
                            note: note || 'Импорт из Excel'
                        });
                        imported++;
                    } catch (err) {
                        errors++;
                    }
                });
                
                if (imported > 0) {
                    saveX2Data();
                    statusEl.textContent = `✅ Импортировано ${imported} матчей! Ошибок: ${errors}`;
                    statusEl.style.color = '#34d399';
                    showNotification(`✅ Импортировано ${imported} X2 матчей из Excel!`, 'success');
                    renderX2Page();
                    if (currentPage === 'dashboard') loadPageData('dashboard');
                    setTimeout(closeX2ImportModal, 2000);
                } else {
                    statusEl.textContent = `❌ Не удалось импортировать матчи. Ошибок: ${errors}`;
                    statusEl.style.color = '#f87171';
                }
                
            } catch (error) {
                statusEl.textContent = '❌ Ошибка чтения файла: ' + error.message;
                statusEl.style.color = '#f87171';
            }
        };
        reader.readAsArrayBuffer(file);
    }

    function exportX2Excel() {
        if (x2Data.length === 0) {
            showNotification('❌ Нет данных для экспорта', 'error');
            return;
        }
        const data = x2Data.map((m, i) => ({
            '#': i + 1,
            'Дата': m.date,
            'Матч': m.match,
            'Фаворит': m.favorite,
            'Аутсайдер': m.underdog,
            'Кэф X2': m.odds,
            'Сумма': m.stake,
            'Счёт': m.score || '-',
            'Результат': m.result.toUpperCase(),
            'Прибыль': m.result === 'win' ? m.profit : m.result === 'loss' ? -m.stake : 0,
            'Примечание': m.note || ''
        }));
        const wb = XLSX.utils.book_new();
        const ws = XLSX.utils.json_to_sheet(data);
        XLSX.utils.book_append_sheet(wb, ws, 'X2 Стратегия');
        XLSX.writeFile(wb, `x2_strategy_${new Date().toISOString().slice(0,10)}.xlsx`);
        showNotification('✅ X2 экспортирован в Excel!', 'success');
    }

    // ============================================================
    // ЭКСПОРТ/ИМПОРТ ПРОЕКТА
    // ============================================================
    function exportProject() {
        const projectData = {
            version: '1.0',
            exportDate: new Date().toISOString(),
            exportedAt: new Date().toLocaleString(),
            settings: JSON.parse(localStorage.getItem('bot_settings')) || {},
            theme: localStorage.getItem('theme') || 'dark',
            data: cachedData || null,
            x2Data: x2Data
        };
        
        if (!projectData.data) {
            showNotification('⏳ Загрузка данных...', '');
            fetch(API_BASE + '/api/all_data')
                .then(response => response.json())
                .then(data => {
                    projectData.data = data;
                    downloadProjectFile(projectData);
                })
                .catch(error => {
                    showNotification('❌ Ошибка загрузки данных: ' + error, 'error');
                });
            return;
        }
        
        downloadProjectFile(projectData);
    }

    function downloadProjectFile(projectData) {
        const json = JSON.stringify(projectData, null, 2);
        const blob = new Blob([json], { type: 'application/json' });
        const url = URL.createObjectURL(blob);
        
        const link = document.createElement('a');
        link.href = url;
        link.download = `quantum_bet_project_${new Date().toISOString().slice(0,10)}.json`;
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);
        URL.revokeObjectURL(url);
        
        showNotification('✅ Проект успешно сохранен!', 'success');
    }

    function importProject(event) {
        const file = event.target.files[0];
        if (!file) return;
        
        showNotification('⏳ Загрузка файла...', '');
        
        const reader = new FileReader();
        reader.onload = function(e) {
            try {
                const projectData = JSON.parse(e.target.result);
                
                if (!projectData.version) {
                    showNotification('❌ Неверный формат файла!', 'error');
                    return;
                }
                
                if (projectData.settings) {
                    localStorage.setItem('bot_settings', JSON.stringify(projectData.settings));
                }
                
                if (projectData.theme) {
                    localStorage.setItem('theme', projectData.theme);
                    if (projectData.theme === 'light') {
                        document.body.classList.add('light-theme');
                        document.getElementById('themeBtn').textContent = '☀️';
                    } else {
                        document.body.classList.remove('light-theme');
                        document.getElementById('themeBtn').textContent = '🌙';
                    }
                }

                if (projectData.x2Data) {
                    x2Data = projectData.x2Data;
                    saveX2Data();
                }
                
                if (projectData.data && projectData.data.history) {
                    showNotification('⏳ Отправка данных на сервер...', '');
                    
                    fetch(API_BASE + '/api/import_project', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            history: projectData.data.history,
                            stats: projectData.data.stats
                        })
                    })
                    .then(response => response.json())
                    .then(result => {
                        if (result.success) {
                            showNotification(`✅ Проект загружен! Импортировано ${result.count || 0} ставок.`, 'success');
                            refreshData();
                        } else {
                            showNotification('❌ Ошибка загрузки: ' + result.error, 'error');
                        }
                    })
                    .catch(error => {
                        showNotification('❌ Ошибка: ' + error, 'error');
                    });
                } else {
                    showNotification('✅ Настройки загружены! Данные не найдены.', 'success');
                    refreshData();
                }
                
            } catch (error) {
                showNotification('❌ Ошибка чтения файла: ' + error, 'error');
            }
        };
        reader.readAsText(file);
        event.target.value = '';
    }

    // ============================================================
    // ВСПОМОГАТЕЛЬНЫЕ ФУНКЦИИ
    // ============================================================
    async function updateBank() {
        const value = document.getElementById('bankInput').value;
        try {
            const response = await fetch(API_BASE + '/api/bank', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ bank: parseFloat(value) })
            });
            const data = await response.json();
            if (data.success) {
                showNotification('✅ Банк обновлен: $' + data.bank, 'success');
                refreshData();
            }
        } catch (e) {
            showNotification('❌ Ошибка: ' + e, 'error');
        }
    }

    function toggleSetting(key, element) {
        const settings = JSON.parse(localStorage.getItem('bot_settings')) || {};
        element.classList.toggle('active');
        settings[key] = element.classList.contains('active');
        localStorage.setItem('bot_settings', JSON.stringify(settings));
        refreshData();
    }

    function importExcel(event) {
        const file = event.target.files[0];
        const statusDiv = document.getElementById('importStatus');
        const fileNameSpan = document.getElementById('fileName');
        if (!file) { statusDiv.textContent = '❌ Файл не выбран'; return; }
        fileNameSpan.textContent = '📄 ' + file.name;
        statusDiv.textContent = '⏳ Загрузка файла...';
        const reader = new FileReader();
        reader.onload = function(e) {
            try {
                const data = new Uint8Array(e.target.result);
                const workbook = XLSX.read(data, {type: 'array'});
                const sheet = workbook.Sheets[workbook.SheetNames[0]];
                const json = XLSX.utils.sheet_to_json(sheet);
                if (json.length === 0) {
                    statusDiv.textContent = '❌ Файл пуст или неправильный формат';
                    return;
                }
                statusDiv.textContent = '⏳ Отправка данных на сервер...';
                fetch(API_BASE + '/api/import_excel', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ data: json })
                })
                .then(response => response.json())
                .then(data => {
                    if (data.success) {
                        statusDiv.textContent = '✅ Импортировано ' + data.count + ' ставок! Страница обновится...';
                        setTimeout(() => refreshData(), 1500);
                    } else {
                        statusDiv.textContent = '❌ Ошибка: ' + data.error;
                    }
                })
                .catch(error => { statusDiv.textContent = '❌ Ошибка: ' + error; });
            } catch (error) {
                statusDiv.textContent = '❌ Ошибка чтения файла: ' + error;
            }
        };
        reader.readAsArrayBuffer(file);
    }

    document.getElementById('importFileInput').addEventListener('change', function() {
        if (this.files.length > 0) {
            document.getElementById('fileName').textContent = '📄 ' + this.files[0].name;
