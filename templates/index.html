                0 8px 32px rgba(0, 0, 0, 0.5),
                inset 0 1px 0 rgba(255, 255, 255, 0.1);
            display: flex;
            justify-content: space-around;
            align-items: center;
            padding: 10px 8px;
            z-index: 1000;
            transition: all 0.3s ease;
        }
        
        body:not(.light-theme) .bottom-nav {
            background: rgba(20, 20, 35, 0.5);
            backdrop-filter: blur(30px) saturate(180%);
            -webkit-backdrop-filter: blur(30px) saturate(180%);
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 
                0 8px 32px rgba(0, 0, 0, 0.5),
                inset 0 1px 0 rgba(255, 255, 255, 0.05);
        }
        
        body.light-theme .bottom-nav {
            background: rgba(255, 255, 255, 0.5);
            backdrop-filter: blur(30px) saturate(180%);
            -webkit-backdrop-filter: blur(30px) saturate(180%);
            border: 1px solid rgba(255, 255, 255, 0.3);
            box-shadow: 
                0 8px 32px rgba(0, 0, 0, 0.1),
                inset 0 1px 0 rgba(255, 255, 255, 0.5);
        }
        
        .bottom-nav .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-decoration: none;
            color: rgba(255, 255, 255, 0.4);
            font-size: 11px;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            padding: 8px 18px;
            border-radius: 18px;
            border: none;
            background: transparent;
            cursor: pointer;
            min-width: 64px;
            position: relative;
            -webkit-tap-highlight-color: transparent;
            user-select: none;
            gap: 4px;
        }
        
        .bottom-nav .nav-item .icon {
            font-size: 26px;
            line-height: 1.2;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }
        
        .bottom-nav .nav-item .label {
            font-size: 10px;
            font-weight: 600;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            opacity: 0.6;
        }
        
        .bottom-nav .nav-item.active {
            color: #a78bfa;
            background: rgba(167, 139, 250, 0.12);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
        }
        
        .bottom-nav .nav-item.active .icon {
            transform: scale(1.05);
            text-shadow: 0 0 20px rgba(167, 139, 250, 0.3);
        }
        
        .bottom-nav .nav-item.active .label {
            opacity: 1;
            color: #a78bfa;
        }
        
        body.light-theme .bottom-nav .nav-item.active {
            background: rgba(124, 58, 237, 0.08);
            color: #7c3aed;
        }
        
        body.light-theme .bottom-nav .nav-item.active .label {
            color: #7c3aed;
        }
        
        .bottom-nav .nav-item.active::before {
            content: '';
            position: absolute;
            top: -1px;
            left: 50%;
            transform: translateX(-50%);
            width: 20px;
            height: 3px;
            background: linear-gradient(90deg, #7c3aed, #a78bfa);
            border-radius: 4px;
            box-shadow: 0 0 20px rgba(124, 58, 237, 0.3);
        }
        
        body.light-theme .bottom-nav .nav-item.active::before {
            background: linear-gradient(90deg, #6d28d9, #7c3aed);
        }
        
        .bottom-nav .nav-item:active {
            transform: scale(0.88);
            transition: transform 0.1s;
        }
        
        .bottom-nav .nav-item:hover {
            color: rgba(255, 255, 255, 0.7);
        }
        
        body.light-theme .bottom-nav .nav-item:hover {
            color: rgba(0, 0, 0, 0.6);
        }
        
        .bottom-nav::after {
            content: '';
            position: absolute;
            top: 1px;
            left: 15%;
            right: 15%;
            height: 30%;
            background: linear-gradient(180deg, rgba(255,255,255,0.15) 0%, transparent 100%);
            border-radius: 50%;
            pointer-events: none;
            opacity: 0.5;
        }
        
        body.light-theme .bottom-nav::after {
            background: linear-gradient(180deg, rgba(255,255,255,0.4) 0%, transparent 100%);
        }
        
        .bottom-nav::before {
            content: '';
            position: absolute;
            bottom: -8px;
            left: 10%;
            right: 10%;
            height: 20px;
            background: radial-gradient(ellipse at 50% 100%, rgba(0,0,0,0.2) 0%, transparent 70%);
            border-radius: 50%;
            filter: blur(10px);
            pointer-events: none;
            opacity: 0.3;
        }
        
        body.light-theme .bottom-nav::before {
            opacity: 0.1;
        }

<script>
    // ============================================================
    // КОНФИГУРАЦИЯ
    // ============================================================
    const API_BASE = window.location.origin;
    
    // ============================================================
    // ЗВЁЗДЫ ДЛЯ ЭКРАНА ЗАГРУЗКИ
    // ============================================================
    (function generateLoadingStars() {
        const container = document.getElementById('loadingStars');

            star.style.height = size + 'px';

    // ============================================================
    // СКРЫТИЕ ЭКРАНА ЗАГРУЗКИ
    // ============================================================
    function hideLoadingScreen() {
        const loading = document.getElementById('loadingScreen');
        if (loading) {
            loading.style.opacity = '0';
            setTimeout(function() {
                loading.style.display = 'none';
            }, 800);
        }
    }

    window.addEventListener('load', function() {
        setTimeout(hideLoadingScreen, 600);
        loadPageData('dashboard');
    });

    // ============================================================
    // ЗВЁЗДЫ ДЛЯ ОСНОВНОГО ФОНА
    // ============================================================
    (function generateStars() {
        const container = document.getElementById('starsContainer');
        const count = 250;
        for (let i = 0; i < count; i++) {
            const star = document.createElement('div');
            star.className = 'star';
            const size = 0.5 + Math.random() * 2.5;
            star.style.width = size + 'px';
            star.style.height = size + 'px';
            star.style.left = Math.random() * 100 + '%';
            star.style.top = Math.random() * 100 + '%';
            star.style.setProperty('--duration', (2 + Math.random() * 4) + 's');
            star.style.animationDelay = (Math.random() * 5) + 's';
            star.style.opacity = 0.3 + Math.random() * 0.7;
            container.appendChild(star);
        }
    })();

    // ============================================================
    // ПЕРЕМЕННЫЕ
    // ============================================================
    let cachedData = null;
    let chartInstance = null;
    let interactiveChartInstance = null;
    let simChartInstance = null;
    let x2ChartInstance = null;
    let currentPage = 'dashboard';
    let isLoading = false;
    let chartData = null;
    let matchesCache = null;
    let editingIndex = null;
    let x2Data = [];
    let editingX2Index = null;
    let currentFilter = 'all';

    // Загружаем X2 данные из localStorage
    function loadX2Data() {
        try {
            const saved = localStorage.getItem('x2_matches');
            if (saved) {
                x2Data = JSON.parse(saved);
            } else {
                x2Data = [
                    {
                        id: Date.now(),
                        date: '2026-09-08',
                        match: 'Al-Ettifaq vs Al-Faisaly',
                        favorite: 'Al-Ettifaq',
                        underdog: 'Al-Faisaly',
                        odds: 2.00,
                        stake: 100,
                        score: '0:0',
                        result: 'win',
                        profit: 100,
                        note: 'Нет мотивации у фаворита'
                    },
                    {
                        id: Date.now() + 1,
                        date: '2026-09-08',
                        match: 'Al-Hazm vs Al Taawon',
                        favorite: 'Al-Taawon',
                        underdog: 'Al-Hazm',
                        odds: 1.80,
                        stake: 100,
                        score: '1:0',
                        result: 'win',
                        profit: 80,
                        note: 'Аутсайдер дома'
                    }
                ];
                saveX2Data();
            }
        } catch (e) {
            x2Data = [];
        }
    }

    function saveX2Data() {
        localStorage.setItem('x2_matches', JSON.stringify(x2Data));
    }

    // ============================================================
    // УВЕДОМЛЕНИЯ
    // ============================================================
    function showNotification(message, type) {
        const notification = document.createElement('div');
        notification.className = 'notification' + (type === 'success' ? ' success' : type === 'error' ? ' error' : '');
        notification.textContent = message;
        document.body.appendChild(notification);
        
        setTimeout(() => {
            notification.style.animation = 'slideOut 0.3s ease';
            setTimeout(() => {
                if (notification.parentNode) {
                    notification.remove();
                }
            }, 300);
        }, 3000);
    }

    // ============================================================
    // ТЕМА
    // ============================================================
    function toggleTheme() {
        const body = document.body;
        const btn = document.getElementById('themeBtn');
        
        if (body.classList.contains('light-theme')) {
            body.classList.remove('light-theme');
            btn.textContent = '🌙';
            localStorage.setItem('theme', 'dark');
            updateAllCharts(false);
        } else {
            body.classList.add('light-theme');
            btn.textContent = '☀️';
            localStorage.setItem('theme', 'light');
            updateAllCharts(true);
        }
    }

    function updateAllCharts(isLight) {
        const color = isLight ? 'rgba(0,0,0,0.6)' : 'rgba(255,255,255,0.6)';
        const gridColor = isLight ? 'rgba(0,0,0,0.05)' : 'rgba(255,255,255,0.03)';
        
        [chartInstance, interactiveChartInstance, simChartInstance, x2ChartInstance].forEach(chart => {
            if (chart) {
                chart.options.plugins.legend.labels.color = color;
                chart.options.scales.x.ticks.color = color;
                chart.options.scales.y.ticks.color = color;
                chart.options.scales.x.grid.color = gridColor;
                chart.options.scales.y.grid.color = gridColor;
                chart.update();
            }
        });
    }

    const savedTheme = localStorage.getItem('theme') || 'dark';
    if (savedTheme === 'light') {
        document.body.classList.add('light-theme');
        document.getElementById('themeBtn').textContent = '☀️';
    } else {
        document.body.classList.remove('light-theme');
        document.getElementById('themeBtn').textContent = '🌙';
    }

    // ============================================================
    // НАВИГАЦИЯ
    // ============================================================
    document.querySelectorAll('.bottom-nav .nav-item').forEach(btn => {
        btn.addEventListener('click', function(e) {
            const page = this.dataset.page;
            switchPage(page);
        });
    });

    function switchPage(page) {
        if (page === currentPage) return;

        document.querySelectorAll('.bottom-nav .nav-item').forEach(b => b.classList.remove('active'));
        document.querySelector(`.bottom-nav .nav-item[data-page="${page}"]`).classList.add('active');

        document.querySelectorAll('.page').forEach(p => {
            p.style.display = 'none';
            p.classList.remove('active');
        });

        const targetPage = document.getElementById('page-' + page);
        if (targetPage) {
            targetPage.style.display = 'block';
            targetPage.classList.add('active');
        }

        currentPage = page;
        loadPageData(page);
    }

    // ============================================================
    // ЗАГРУЗКА ДАННЫХ
    // ============================================================
    async function loadPageData(page) {
        if (isLoading) return;

        const contentId = page + '-content';
        const contentEl = document.getElementById(contentId);

        if (page !== 'dashboard' && cachedData && contentEl.innerHTML && page !== 'analytics' && page !== 'x2') {
            return;
        }

        isLoading = true;
        if (page !== 'x2') {
            contentEl.innerHTML = '<div class="loader active"><div class="spinner"></div><div style="color:rgba(255,255,255,0.4);font-size:12px;margin-top:6px;">Загрузка...</div></div>';
        }

        try {
            const response = await fetch(API_BASE + '/api/all_data?t=' + Date.now());
            if (!response.ok) {
                throw new Error('Сервер вернул ошибку: ' + response.status);
            }
            const data = await response.json();
            
            try {
                const matchesData = await loadMatches();
                if (matchesData && matchesData.length > 0) {
                    data.matches = matchesData;
                    console.log('✅ Загружено матчей:', matchesData.length);
                }
            } catch (e) {
                console.log('Матчи не загружены отдельно');
            }
            
            cachedData = data;

            switch(page) {
                case 'dashboard': renderDashboard(data); break;
                case 'analysis': renderAnalysis(data); break;
                case 'x2': renderX2Page(); break;
                case 'analytics': renderAnalytics(data); break;
                case 'simulator': renderSimulator(data); break;
                case 'settings': renderSettings(data); break;
            }
            
            hideLoadingScreen();
        } catch (error) {
            console.error('Ошибка загрузки:', error);
            if (page !== 'x2') {
                contentEl.innerHTML = `
                    <div class="no-data">
                        <div class="emoji">⚠️</div>
                        <div>Ошибка загрузки данных!</div>
                        <div style="font-size:11px;color:rgba(255,255,255,0.3);margin-top:4px;">
                            ${error.message}
                        </div>
                        <button onclick="refreshData()" style="margin-top:8px;padding:6px 16px;background:rgba(124,58,237,0.2);border:1px solid rgba(124,58,237,0.3);border-radius:6px;color:#a78bfa;cursor:pointer;">
                            🔄 Повторить
                        </button>
                    </div>
                `;
            }
            hideLoadingScreen();
            showNotification('❌ Ошибка загрузки: ' + error.message, 'error');
        }

        isLoading = false;
    }

    function refreshData() {
        cachedData = null;
        matchesCache = null;
        loadPageData(currentPage);
        showNotification('🔄 Обновление данных...', '');
    }

    async function loadMatches() {
        try {
            const response = await fetch(API_BASE + '/api/matches?t=' + Date.now());
            if (response.ok) {
                const data = await response.json();
                matchesCache = data;
                return data;
            }
            return null;
        } catch (e) {
            console.log('Ошибка загрузки матчей:', e);
            return null;
        }
    }

    // ============================================================
    // РЕДАКТИРОВАНИЕ СТАВКИ
    // ============================================================
    function toggleEdit(index) {
        const row = document.getElementById('edit-row-' + index);
        if (row) {
            row.classList.toggle('active');
            if (row.classList.contains('active')) {
                editingIndex = index;
                const item = getItemByIndex(index);
                if (item) {
                    document.getElementById('edit_home_' + index).value = item.home || '';
                    document.getElementById('edit_away_' + index).value = item.away || '';
                    document.getElementById('edit_score_' + index).value = item.score || '';
                    document.getElementById('edit_bet_' + index).value = item.bet || '';
                    document.getElementById('edit_odds_' + index).value = item.odds || 0;
                    document.getElementById('edit_stake_' + index).value = item.stake || 0;
                    document.getElementById('edit_ev_' + index).value = item.ev || 0;
                    document.getElementById('edit_marker_' + index).value = item.marker || '';
                    document.getElementById('edit_result_' + index).value = item.result || 'pending';
                }
            } else {
                editingIndex = null;
            }
        }
    }

    function getItemByIndex(index) {
        if (!cachedData) return null;
        const history = cachedData.history || [];
        const matches = cachedData.matches || [];
        let allItems = [];
        
        if (matches && matches.length > 0) {
            matches.forEach((match) => {
                const bestBet = match.best_bet || match.bets?.[0] || {};
                allItems.push({
                    type: 'match',
                    date: match.match_time || 'Сегодня',
                    home: match.home || 'Unknown',
                    away: match.away || 'Unknown',
                    score: '-',
                    bet: bestBet.label || '—',
                    odds: bestBet.odds || 0,
                    stake: bestBet.stake || 0,
                    ev: bestBet.ev || 0,
                    result: 'pending',
                    profit: 0,
                    marker: bestBet.marker_stake || '',
                    is_active: true
                });
            });
        }
        
        if (history && history.length > 0) {
            history.forEach((bet) => {
                allItems.push({
                    type: 'history',
                    date: bet.date || '-',
                    home: bet.home || 'Unknown',
                    away: bet.away || 'Unknown',
                    score: (bet.home_goals !== null && bet.away_goals !== null) ? bet.home_goals + ' - ' + bet.away_goals : '-',
                    bet: bet.bet || '—',
                    odds: bet.odds || 0,
                    stake: bet.stake || 0,
                    ev: bet.ev || 0,
                    result: bet.result || 'pending',
                    profit: bet.profit || 0,
                    marker: bet.marker_stake || '',
                    is_active: false
                });
            });
        }
        
        allItems.sort((a, b) => {
            if (a.is_active && !b.is_active) return -1;
            if (!a.is_active && b.is_active) return 1;
            try { return new Date(b.date) - new Date(a.date); } catch { return 0; }
        });
        
        allItems = allItems.slice(0, 50);
        
        if (index < allItems.length) {
            return allItems[index];
        }
        return null;
    }

    function getHistoryIndex(displayIndex) {
        if (!cachedData) return null;
        const history = cachedData.history || [];
        const matches = cachedData.matches || [];
        let allItems = [];
        
        if (matches && matches.length > 0) {
            matches.forEach((match) => {
                const bestBet = match.best_bet || match.bets?.[0] || {};
                allItems.push({
                    type: 'match',
                    date: match.match_time || 'Сегодня',
                    home: match.home || 'Unknown',
                    away: match.away || 'Unknown',
                    score: '-',
                    bet: bestBet.label || '—',
                    odds: bestBet.odds || 0,
                    stake: bestBet.stake || 0,
                    ev: bestBet.ev || 0,
                    result: 'pending',
                    profit: 0,
                    marker: bestBet.marker_stake || '',
                    is_active: true
                });
            });
        }
        
        if (history && history.length > 0) {
            history.forEach((bet) => {
                allItems.push({
                    type: 'history',
                    date: bet.date || '-',
                    home: bet.home || 'Unknown',
                    away: bet.away || 'Unknown',
                    score: (bet.home_goals !== null && bet.away_goals !== null) ? bet.home_goals + ' - ' + bet.away_goals : '-',
                    bet: bet.bet || '—',
                    odds: bet.odds || 0,
                    stake: bet.stake || 0,
                    ev: bet.ev || 0,
                    result: bet.result || 'pending',
                    profit: bet.profit || 0,
                    marker: bet.marker_stake || '',
                    is_active: false
                });
            });
        }
        
        allItems.sort((a, b) => {
            if (a.is_active && !b.is_active) return -1;
            if (!a.is_active && b.is_active) return 1;
            try { return new Date(b.date) - new Date(a.date); } catch { return 0; }
        });
        
        allItems = allItems.slice(0, 50);
        
        if (displayIndex < allItems.length && allItems[displayIndex].type === 'history') {
            return history.length - 1 - allItems.slice(0, displayIndex + 1).filter(i => i.type === 'history').length;
        }

    // ============================================================
    // ДЕТЕКТОР ДРОБНЫХ СУММ
    // ============================================================
    function getDecimalPlaces(num) {
        const str = num.toString();
        const decimalIndex = str.indexOf('.');
        if (decimalIndex === -1) return 0;
        return str.length - decimalIndex - 1;
    }

    function shouldAnalyzeStake(stake) {
        const decimalPlaces = getDecimalPlaces(stake);
        return decimalPlaces >= 3;
    }

    function detectDecimalPatterns(history) {
        const settings = JSON.parse(localStorage.getItem('bot_settings')) || {};
        if (!settings.anomaly_detection) return [];
        
        const patterns = [];
        const stakeGroups = {};
        
        history.forEach((bet, index) => {
            const stake = parseFloat(bet.stake) || 0;
            if (stake > 0 && shouldAnalyzeStake(stake)) {
                const key = stake.toString();
                if (!stakeGroups[key]) {
                    stakeGroups[key] = {
                        stake: stake,
                        bets: []
                    };
                }
                stakeGroups[key].bets.push({
                    index: index,
                    bet: bet,
                    match: `${bet.home} vs ${bet.away}`,
                    score: bet.home_goals !== null && bet.away_goals !== null ? `${bet.home_goals}-${bet.away_goals}` : '-',
                    result: bet.result,
                    profit: bet.profit,
                    date: bet.date,
                    odds: bet.odds,
                    ev: bet.ev
                });
            }
        });
        
        Object.values(stakeGroups).forEach(group => {
            if (group.bets.length >= 2) {
                const wins = group.bets.filter(b => b.result === 'win').length;
                const losses = group.bets.filter(b => b.result === 'loss').length;
                const pushes = group.bets.filter(b => b.result === 'push').length;
                const totalProfit = group.bets.reduce((sum, b) => sum + (b.profit || 0), 0);
                const winrate = group.bets.length > 0 ? (wins / group.bets.length * 100) : 0;
                
                const profits = group.bets.map(b => b.profit || 0);
                const avgProfit = profits.reduce((a, b) => a + b, 0) / profits.length || 0;
                const maxProfit = Math.max(...profits) || 0;
                const minProfit = Math.min(...profits) || 0;
                const totalStakes = group.bets.reduce((sum, b) => sum + (b.bet.stake || 0), 0);
                const roi = totalStakes > 0 ? (totalProfit / totalStakes * 100) : 0;
                
                let status = '📌';
                let recommendation = '';
                if (winrate >= 70 && group.bets.length >= 3) {
                    status = '🟢';
                    recommendation = '🔥 Отличная рабочая сумма! Продолжайте использовать.';
                } else if (winrate >= 50 && group.bets.length >= 3) {
                    status = '🟢';
                    recommendation = '👍 Хорошая сумма, стабильный результат.';
                } else if (winrate < 40 && group.bets.length >= 3) {
                    status = '🔴';
                    recommendation = '⚠️ Неудачная сумма! Рекомендуем изменить размер.';
                } else if (group.bets.length >= 4) {
                    status = '🟡';
                    recommendation = 'Часто используемая сумма. Анализируйте результаты.';
                } else {
                    status = '🟡';
                    recommendation = 'Повторяющаяся сумма. Следите за статистикой.';
                }
                
                patterns.push({
                    stake: group.stake,
                    count: group.bets.length,
                    wins: wins,
                    losses: losses,
                    pushes: pushes,
                    winrate: winrate,
                    totalProfit: totalProfit,
                    avgProfit: avgProfit,
                    maxProfit: maxProfit,
                    minProfit: minProfit,
                    roi: roi,
                    status: status,
                    recommendation: recommendation,
                    bets: group.bets
                });
            }
        });
        
        patterns.sort((a, b) => b.count - a.count);
        return patterns;
    }

    function getSkippedSums(history) {
        const skipped = {};
        history.forEach(bet => {
            const stake = parseFloat(bet.stake) || 0;
            if (stake > 0 && !shouldAnalyzeStake(stake)) {
                const key = stake.toFixed(2);
                if (!skipped[key]) {
                    skipped[key] = { stake: stake, count: 0 };
                }
                skipped[key].count++;
            }
        });
        return Object.values(skipped).filter(s => s.count >= 2);
    }

    function getRecommendation(stake) {
        const stakeStr = stake.toString();
        
        const recommendations = {
            '45.125': {
                bet: '1X',
                icon: '🏠',
                description: 'Хозяева не проиграют (Победа или ничья хозяев)'
            },
            '40.7253125': {
                bet: 'ОБЗ',
                icon: '⚽',
                description: 'Обе команды забьют'
            },
            '42.86875000000006': {
                bet: 'ТМ 2.5',
                icon: '🔽',
                description: 'Тотал меньше 2.5 голов'
            }
        };
        
        for (const [key, value] of Object.entries(recommendations)) {
            if (stakeStr === key || stakeStr.startsWith(key) || key.startsWith(stakeStr)) {
                return value;
            }
        }
        
        return {
            bet: '—',
            icon: '📌',
            description: 'Нет рекомендации для этой суммы'
        };
    }

    // ============================================================
    // АНАЛИЗ МАТЧЕЙ
    // ============================================================
    async function loadMatchAnalysis() {
        try {
            document.getElementById('maTotal').textContent = '⏳';
            document.getElementById('maPassed').textContent = '⏳';
            document.getElementById('maSkipped').textContent = '⏳';
            document.getElementById('maRate').textContent = '⏳%';
            
            let response = await fetch('/api/matches_log?t=' + Date.now());
            let logText = '';
            let source = 'none';
            
            if (response.ok) {
                const data = await response.json();
                logText = data.log || '';
                source = data.source || 'bot';
                console.log('📥 Источник лога:', source);
                console.log('📄 Длина лога:', logText.length);
            }
            
            if (logText && logText.trim() !== '' && logText.length > 50) {
                const analyzeResponse = await fetch('/api/analyze_matches', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ log: logText })
                });
                
                const result = await analyzeResponse.json();
                
                if (!result.success) {
                    showNotification('❌ Ошибка анализа: ' + result.error, 'error');
                    return;
                }
                
                updateAnalysisUI(result.stats, result.recommendations);
                
                const sourceText = source === 'test_data' ? ' (тестовые)' : '';
                showNotification(`✅ Анализ матчей обновлен${sourceText} (${result.stats.total} матчей)`, 'success');
                return;
            }
            
            const matchesResponse = await fetch('/api/matches?t=' + Date.now());
            if (matchesResponse.ok) {
                const matches = await matchesResponse.json();
                if (matches && matches.length > 0) {
                    let logLines = [];
                    matches.forEach(match => {
                        const xg = match.total_xg || 0;
                        const home = match.home || 'Unknown';
                        const away = match.away || 'Unknown';
                        const skipReason = match.skip_reason || '';
                        
                        if (skipReason) {
                            if (skipReason.toLowerCase().includes('xg') || skipReason.includes('XG')) {
                                logLines.push(`⏭️ Пропускаем (XG вне диапазона 1.8-3.0): ${home} vs ${away} | XG: ${xg}`);
                            } else if (skipReason.toLowerCase().includes('позици')) {
                                logLines.push(`⏭️ Пропускаем (низкая позиция): ${home} vs ${away}`);
                            } else if (skipReason.toLowerCase().includes('мотиваци')) {
                                logLines.push(`⏭️ Пропускаем (нет мотивации): ${home} vs ${away}`);
                            }
                        }
                    });
                    
                    if (logLines.length > 0) {
                        logText = logLines.join('\n');
                        await fetch('/api/save_bot_log', {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify({ log: logText })
                        });
                        
                        const analyzeResponse = await fetch('/api/analyze_matches', {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify({ log: logText })
                        });
                        
                        const result = await analyzeResponse.json();
                        if (result.success) {
                            updateAnalysisUI(result.stats, result.recommendations);
                            showNotification(`✅ Анализ матчей обновлен из матчей бота (${result.stats.total} матчей)`, 'success');
                            return;
                        }
                    }
                }
            }
            
            showNotification('⚠️ Нет данных для анализа. Используются тестовые данные.', '');
            resetAnalysisUI();
            
            const testResponse = await fetch('/api/test_analysis');
            if (testResponse.ok) {
                const testData = await testResponse.json();
                if (testData.success && testData.stats.total > 0) {
                    updateAnalysisUI(testData.stats, testData.recommendations);
                    showNotification('📊 Используются тестовые данные', '');
                    return;
                }
            }
            
        } catch (error) {
            console.error('Ошибка загрузки анализа:', error);
            showNotification('❌ Ошибка: ' + error.message, 'error');
            resetAnalysisUI();
        }
    }

    function updateAnalysisUI(stats, recommendations) {
        document.getElementById('maTotal').textContent = stats.total || 0;
        
        const skipped = (stats.categories?.no_motivation?.count || 0) + 
                       (stats.categories?.low_position?.count || 0) + 
                       (stats.categories?.xg_out_of_range?.count || 0);
        const passed = (stats.total || 0) - skipped;
        
        document.getElementById('maPassed').textContent = passed;
        document.getElementById('maSkipped').textContent = skipped;
        document.getElementById('maRate').textContent = stats.total > 0 ? 
            ((passed / stats.total) * 100).toFixed(1) + '%' : '0%';
        
        document.getElementById('maNoMotivation').textContent = stats.categories?.no_motivation?.count || 0;
        document.getElementById('maLowPosition').textContent = stats.categories?.low_position?.count || 0;
        document.getElementById('maXGOut').textContent = stats.categories?.xg_out_of_range?.count || 0;
        
        const recDiv = document.getElementById('matchRecommendations');
        const recList = document.getElementById('recommendationsList');
        
        if (recommendations && recommendations.length > 0 && stats.total > 0) {
            recDiv.style.display = 'block';
            recList.innerHTML = recommendations.map(r => '• ' + r).join('<br>');
        } else {
            recDiv.style.display = 'none';
        }
    }

    function resetAnalysisUI() {
        document.getElementById('maTotal').textContent = '0';
        document.getElementById('maPassed').textContent = '0';
        document.getElementById('maSkipped').textContent = '0';
        document.getElementById('maRate').textContent = '0%';
        document.getElementById('maNoMotivation').textContent = '0';
        document.getElementById('maLowPosition').textContent = '0';
        document.getElementById('maXGOut').textContent = '0';
        document.getElementById('matchRecommendations').style.display = 'none';
    }

    // ============================================================
    // X2 ФУНКЦИИ
    // ============================================================
    function calcX2Stats() {
        const total = x2Data.length;
        const wins = x2Data.filter(m => m.result === 'win').length;
        const losses = x2Data.filter(m => m.result === 'loss').length;
        const pushes = x2Data.filter(m => m.result === 'push').length;
        const pending = x2Data.filter(m => m.result === 'pending').length;
        const totalProfit = x2Data.reduce((sum, m) => sum + (m.result === 'win' ? m.profit : m.result === 'loss' ? -m.stake : 0), 0);
        const totalStake = x2Data.reduce((sum, m) => sum + m.stake, 0);
        const winrate = total > 0 ? Math.round((wins / total) * 100) : 0;
        const roi = totalStake > 0 ? Math.round((totalProfit / totalStake) * 100) : 0;
        return { total, wins, losses, pushes, pending, totalProfit, winrate, roi };
    }

    function getFilteredX2() {
        if (currentFilter === 'all') return [...x2Data];
        return x2Data.filter(m => m.result === currentFilter);
    }

        currentFilter = filter;

    function closeX2Modal() {
        document.getElementById('x2Modal').classList.remove('active');
        editingX2Index = null;
    }

    function saveX2Match() {
        const date = document.getElementById('x2Date').value;
        const match = document.getElementById('x2Match').value.trim();
        const favorite = document.getElementById('x2Favorite').value.trim();
        const underdog = document.getElementById('x2Underdog').value.trim();
        const odds = parseFloat(document.getElementById('x2Odds').value);
        const stake = parseFloat(document.getElementById('x2Stake').value);
        const score = document.getElementById('x2Score').value.trim();
        const result = document.getElementById('x2Result').value;
        const note = document.getElementById('x2Note').value.trim();

        if (!match || !favorite || !underdog || !odds || !stake) {
            showNotification('❌ Заполните все обязательные поля!', 'error');
            return;
        }

        let profit = 0;
        if (result === 'win') profit = Math.round((stake * odds - stake) * 100) / 100;
        else if (result === 'loss') profit = -stake;
        else if (result === 'push') profit = 0;

        const data = { date, match, favorite, underdog, odds, stake, score, result, profit, note };

        if (editingX2Index !== null && editingX2Index >= 0 && editingX2Index < x2Data.length) {
            x2Data[editingX2Index] = { ...x2Data[editingX2Index], ...data };
            showNotification('✅ X2 матч обновлен!', 'success');
        } else {
            data.id = Date.now();
            x2Data.push(data);
            showNotification('✅ X2 матч добавлен!', 'success');
        }

        saveX2Data();
        closeX2Modal();
        renderX2Page();
        if (currentPage === 'dashboard') loadPageData('dashboard');
    }

    function editX2Match(index) {
        if (index >= 0 && index < x2Data.length) {
            openX2Modal(x2Data[index]);
        }

    function deleteX2Match(index) {
        if (index >= 0 && index < x2Data.length) {
            if (confirm(`Удалить X2 матч: ${x2Data[index].match}?`)) {
                x2Data.splice(index, 1);
                saveX2Data();
                renderX2Page();
                if (currentPage === 'dashboard') loadPageData('dashboard');
                showNotification('🗑️ X2 матч удален', '');
            }
        }
    }

        if (x2Data.length === 0) {
            showNotification('❌ Нет данных для экспорта', 'error');

        const data = x2Data.map((m, i) => ({

            'Фаворит': m.favorite,

            'Кэф X2': m.odds,
            'Сумма': m.stake,
            'Счёт': m.score || '-',
            'Результат': m.result.toUpperCase(),
            'Прибыль': m.result === 'win' ? m.profit : m.result === 'loss' ? -m.stake : 0,
            'Примечание': m.note || ''
        }));
        const wb = XLSX.utils.book_new();

        showNotification('✅ X2 экспортирован в Excel!', 'success');

    function renderPatternCard(pattern, idx) {

        interactiveChartInstance = new Chart(ctx, {
            type: 'line',
            data: {
                labels: [],
                datasets: [{
                    label: 'Прибыль ($)',

                    borderColor: '#a78bfa',

                    tension: 0.4,

            options: {

                },

                        labels: {
                            color: color,
                            font: { size: 11 }
                        }
                    },
                    tooltip: {
                        backgroundColor: isLight ? 'rgba(255,255,255,0.9)' : 'rgba(0,0,0,0.8)',
                        titleColor: isLight ? '#1a1a2e' : '#fff',
                        bodyColor: isLight ? '#1a1a2e' : '#fff',
                        borderColor: 'rgba(167,139,250,0.3)',
                        borderWidth: 1,
                        padding: 12,

                },

                        ticks: {

                            font: { size: 9 },

                        },
                        grid: {
                            color: gridColor
                        }
                    },
                    y: {
                        ticks: {
                            color: color,
                            font: { size: 9 },
                            callback: function(value) {
                                return '$' + value;
                            }
                        },
                        grid: {
                            color: gridColor

                    }
                },
                onClick: function(event, elements) {

    function updateInteractiveChart() {
        if (!interactiveChartInstance) return;

        const period = document.getElementById('chartPeriod').value;
        const type = document.getElementById('chartType').value;
        const history = window._historyData || [];

        let filtered = [...history];
        if (period !== 'all') {
            const days = parseInt(period);
            const cutoff = new Date();
            cutoff.setDate(cutoff.getDate() - days);
            filtered = filtered.filter(bet => {
                try {
                    const betDate = new Date(bet.date.split(' ')[0]);
                    return betDate >= cutoff;
                } catch {
                    return false;
                }
            });
        }

        filtered.sort((a, b) => {
            try {
                return new Date(a.date) - new Date(b.date);
            } catch {
                return 0;
            }
        });

        const labels = [];
        const values = [];
        let cumulative = 0;
        let bank = 1000;

        filtered.forEach((bet, index) => {
            labels.push(bet.date);
            
            if (type === 'profit') {
                cumulative += bet.profit || 0;
                values.push(Math.round(cumulative * 100) / 100);
            } else if (type === 'bank') {
                bank += bet.profit || 0;
                values.push(Math.round(bank * 100) / 100);
            } else {
                const wins = filtered.slice(0, index + 1).filter(b => b.result === 'win').length;
                const total = index + 1;
                values.push(Math.round((wins / total) * 1000) / 10);
            }
        });

        chartData = filtered;

        const labelsMap = {
            'profit': 'Прибыль ($)',
            'bank': 'Банк ($)',
            'winrate': 'Проходимость (%)'
        };

        interactiveChartInstance.data.labels = labels;
        interactiveChartInstance.data.datasets[0].data = values;
        interactiveChartInstance.data.datasets[0].label = labelsMap[type] || 'Прибыль ($)';
        interactiveChartInstance.update();
    }

    async function runSimulation() {
        const count = parseInt(document.getElementById('simCount').value) || 1000;
        document.getElementById('simResults').style.display = 'block';
        try {
            const response = await fetch(API_BASE + '/api/simulate', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ count: count })
            });
            const data = await response.json();
            if (data.error) {
                showNotification('❌ Ошибка: ' + data.error, 'error');
                return;
            }
            document.getElementById('simProfit').textContent = '$' + data.profit;
            document.getElementById('simWinrate').textContent = data.winrate + '%';
            document.getElementById('simROI').textContent = data.roi + '%';
            document.getElementById('simRisk').textContent = data.risk + '%';
            document.getElementById('simTotal').textContent = data.total;
            document.getElementById('simWins').textContent = data.wins;
            document.getElementById('simLosses').textContent = data.losses;
            document.getElementById('simMaxProfit').textContent = '$' + data.max_profit;
            document.getElementById('simMinProfit').textContent = '$' + data.min_profit;
            document.getElementById('simAvgStake').textContent = '$' + data.avg_stake;
            const rec = document.getElementById('simRecommendation');
            if (data.profit > 0) {
                rec.innerHTML = '✅ <b style="color:#34d399;">Отличный результат!</b> Ваша стратегия принесла бы прибыль!<br>💡 Средняя прибыль на ставку: $' + (data.profit / data.total).toFixed(2) + '<br>🔥 Лучший результат: +$' + data.max_profit;
            } else {
                rec.innerHTML = '⚠️ <b style="color:#f87171;">Стратегия требует улучшения</b><br>💡 Попробуйте снизить сумму ставок<br>📊 Работайте над проходимостью (сейчас ' + data.winrate + '%)';
            }
            const ctx = document.getElementById('simChart');
            if (ctx) {
                if (simChartInstance) { simChartInstance.destroy(); simChartInstance = null; }
                const isLight = document.body.classList.contains('light-theme');
                simChartInstance = new Chart(ctx, {
                    type: 'line',
                    data: {
                        labels: data.labels || Array.from({length: data.history.length}, (_, i) => i + 1),
                        datasets: [{
                            label: 'Прибыль ($)',
                            data: data.history || [],
                            borderColor: data.profit > 0 ? '#34d399' : '#f87171',
                            backgroundColor: data.profit > 0 ? 'rgba(52,211,153,0.08)' : 'rgba(248,113,113,0.08)',
                            fill: true,
                            tension: 0.4,
                            pointRadius: 2
                        }]
                    },
                    options: {
                        responsive: true,
                        maintainAspectRatio: false,
                        plugins: {
                            legend: { labels: { color: isLight ? 'rgba(0,0,0,0.6)' : 'rgba(255,255,255,0.6)', font: { size: 9 } } }
                        },
                        scales: {
                            x: { ticks: { color: isLight ? 'rgba(0,0,0,0.3)' : 'rgba(255,255,255,0.3)', font: { size: 8 } }, grid: { color: isLight ? 'rgba(0,0,0,0.05)' : 'rgba(255,255,255,0.03)' } },
                            y: { ticks: { color: isLight ? 'rgba(0,0,0,0.3)' : 'rgba(255,255,255,0.3)', callback: function(value) { return '$' + value; }, font: { size: 8 } }, grid: { color: isLight ? 'rgba(0,0,0,0.05)' : 'rgba(255,255,255,0.03)' } }
                        }
                    }
                });
            }
        } catch (e) {
            showNotification('❌ Ошибка: ' + e, 'error');
        }
    }

    function clearAllX2() {
        if (confirm('⚠️ Удалить все X2 матчи?')) {
            x2Data = [];
            saveX2Data();
            renderX2Page();
            if (currentPage === 'dashboard') loadPageData('dashboard');

        }

    // ============================================================
    // ЭКСПОРТ/ИМПОРТ ПРОЕКТА
    // ============================================================
    function exportProject() {
        const projectData = {
            version: '1.0',
            exportDate: new Date().toISOString(),
            exportedAt: new Date().toLocaleString(),
            settings: JSON.parse(localStorage.getItem('bot_settings')) || {},
            theme: localStorage.getItem('theme') || 'dark',
            data: cachedData || null,
            x2Data: x2Data
        };
        
        if (!projectData.data) {
            showNotification('⏳ Загрузка данных...', '');
            fetch(API_BASE + '/api/all_data')
                .then(response => response.json())
                .then(data => {
                    projectData.data = data;
                    downloadProjectFile(projectData);
                })
                .catch(error => {
                    showNotification('❌ Ошибка загрузки данных: ' + error, 'error');
                });
            return;
        }
        
        downloadProjectFile(projectData);
    }

    function downloadProjectFile(projectData) {
        const json = JSON.stringify(projectData, null, 2);
        const blob = new Blob([json], { type: 'application/json' });
        const url = URL.createObjectURL(blob);
        
        const link = document.createElement('a');
        link.href = url;
        link.download = `quantum_bet_project_${new Date().toISOString().slice(0,10)}.json`;
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);
        URL.revokeObjectURL(url);
        
        showNotification('✅ Проект успешно сохранен!', 'success');
    }

    function importProject(event) {
        const file = event.target.files[0];
        if (!file) return;
        
        showNotification('⏳ Загрузка файла...', '');
        
        const reader = new FileReader();
        reader.onload = function(e) {
            try {
                const projectData = JSON.parse(e.target.result);
                
                if (!projectData.version) {
                    showNotification('❌ Неверный формат файла!', 'error');
                    return;
                }
                
                if (projectData.settings) {
                    localStorage.setItem('bot_settings', JSON.stringify(projectData.settings));
                }
                
                if (projectData.theme) {
                    localStorage.setItem('theme', projectData.theme);
                    if (projectData.theme === 'light') {
                        document.body.classList.add('light-theme');
                        document.getElementById('themeBtn').textContent = '☀️';
                    } else {
                        document.body.classList.remove('light-theme');
                        document.getElementById('themeBtn').textContent = '🌙';
                    }
                }

                if (projectData.x2Data) {
                    x2Data = projectData.x2Data;
                    saveX2Data();
                }
                
                if (projectData.data && projectData.data.history) {
                    showNotification('⏳ Отправка данных на сервер...', '');
                    
                    fetch(API_BASE + '/api/import_project', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            history: projectData.data.history,
                            stats: projectData.data.stats
                        })
                    })
                    .then(response => response.json())
                    .then(result => {
                        if (result.success) {
                            showNotification(`✅ Проект загружен! Импортировано ${result.count || 0} ставок.`, 'success');
                            refreshData();
                        } else {
                            showNotification('❌ Ошибка загрузки: ' + result.error, 'error');
                        }
                    })
                    .catch(error => {
                        showNotification('❌ Ошибка: ' + error, 'error');
                    });
                } else {
                    showNotification('✅ Настройки загружены! Данные не найдены.', 'success');
                    refreshData();
                }
                
            } catch (error) {
                showNotification('❌ Ошибка чтения файла: ' + error, 'error');
            }
        };
        reader.readAsText(file);
        event.target.value = '';
    }

    // ============================================================
    // ВСПОМОГАТЕЛЬНЫЕ ФУНКЦИИ
    // ============================================================
    async function updateBank() {
        const value = document.getElementById('bankInput').value;
        try {
            const response = await fetch(API_BASE + '/api/bank', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ bank: parseFloat(value) })
            });
            const data = await response.json();
            if (data.success) {
                showNotification('✅ Банк обновлен: $' + data.bank, 'success');
                refreshData();
            }
        } catch (e) {
            showNotification('❌ Ошибка: ' + e, 'error');
        }
    }

    function toggleSetting(key, element) {
        const settings = JSON.parse(localStorage.getItem('bot_settings')) || {};
        element.classList.toggle('active');
        settings[key] = element.classList.contains('active');
        localStorage.setItem('bot_settings', JSON.stringify(settings));
        refreshData();
    }

    function importExcel(event) {
        const file = event.target.files[0];
        const statusDiv = document.getElementById('importStatus');
        const fileNameSpan = document.getElementById('fileName');
        if (!file) { statusDiv.textContent = '❌ Файл не выбран'; return; }
        fileNameSpan.textContent = '📄 ' + file.name;
        statusDiv.textContent = '⏳ Загрузка файла...';
        const reader = new FileReader();
        reader.onload = function(e) {
            try {
                const data = new Uint8Array(e.target.result);
                const workbook = XLSX.read(data, {type: 'array'});
                const sheet = workbook.Sheets[workbook.SheetNames[0]];
                const json = XLSX.utils.sheet_to_json(sheet);
                if (json.length === 0) {
                    statusDiv.textContent = '❌ Файл пуст или неправильный формат';
                    return;
                }
                statusDiv.textContent = '⏳ Отправка данных на сервер...';
                fetch(API_BASE + '/api/import_excel', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ data: json })
                })
                .then(response => response.json())
                .then(data => {
                    if (data.success) {
                        statusDiv.textContent = '✅ Импортировано ' + data.count + ' ставок! Страница обновится...';
                        setTimeout(() => refreshData(), 1500);
                    } else {
                        statusDiv.textContent = '❌ Ошибка: ' + data.error;
                    }
                })
                .catch(error => { statusDiv.textContent = '❌ Ошибка: ' + error; });
            } catch (error) {
                statusDiv.textContent = '❌ Ошибка чтения файла: ' + error;
            }
        };
        reader.readAsArrayBuffer(file);
    }

    document.getElementById('importFileInput').addEventListener('change', function() {
        if (this.files.length > 0) {
            document.getElementById('fileName').textContent = '📄 ' + this.files[0].name;
        }
    });

    // ============================================================
    // ЗАПУСК
    // ============================================================
    document.addEventListener('DOMContentLoaded', function() {
        loadX2Data();
        loadPageData('dashboard');
    });
</script>
