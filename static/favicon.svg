<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7c3aed"/>
      <stop offset="100%" stop-color="#4c1d95"/>
    </linearGradient>
  </defs>
  
  <!-- Фон со скруглением -->
  <rect width="512" height="512" rx="100" fill="url(#bg)"/>
  
  <!-- Буква Q -->
  <text x="260" y="350" font-size="280" font-weight="700" 
        font-family="Arial, sans-serif" text-anchor="middle" 
        fill="white" letter-spacing="-5">Q</text>
  
  <!-- Стрелка вверх ↗ -->
  <g transform="translate(340, 160)">
    <line x1="0" y1="50" x2="50" y2="0" stroke="#fbbf24" stroke-width="16" stroke-linecap="round"/>
    <polygon points="50,0 25,-20 65,20" fill="#fbbf24"/>
  </g>
</svg>
