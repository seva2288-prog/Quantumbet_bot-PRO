<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- Фиолетовый фон -->
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7c3aed"/>
      <stop offset="100%" stop-color="#4c1d95"/>
    </linearGradient>
  </defs>
  
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  
  <!-- Буква Q (большая, по центру) -->
  <text x="250" y="360" font-size="280" font-weight="700" 
        font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif" 
        text-anchor="middle" fill="white">Q</text>
  
  <!-- Стрелка вверх справа (↗) -->
  <g transform="translate(340, 160)">
    <line x1="0" y1="50" x2="50" y2="0" stroke="#fbbf24" stroke-width="18" stroke-linecap="round"/>
    <polygon points="50,0 20,-25 70,18" fill="#fbbf24"/>
  </g>
</svg>
