services:
  - type: web
    name: quantumbet-web
    env: python
    buildCommand: |
      pip install --upgrade pip
      pip install setuptools wheel
      pip install -r requirements.txt
    startCommand: python web_app.py
    envVars:
      - key: TELEGRAM_TOKEN
        sync: false
      - key: FOOTBALL_API_KEY
        sync: false
      - key: WEATHER_API_KEY
        sync: false
      - key: ADMIN_CHAT_ID
        sync: false
    plan: free
